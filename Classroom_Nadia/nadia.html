<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandai DS — School Header Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Pandai DS 1.5 Primitives ───────────────────────────────── */
    :root {
      --og-green-500: #00cc85;
      --og-green-600: #00a36a;

      --pink-50:  #ffebf2;
      --pink-100: #ffdeea;
      --pink-200: #ffbed6;
      --pink-300: #ff9dc1;
      --pink-400: #ff7dad;
      --pink-500: #ff5c98;
      --pink-600: #cc4a7a;
      --pink-700: #99375b;
      --pink-800: #66253d;

      --gray-400: #9ca3af;
      --gray-600: #6b7280;
      --gray-800: #1f2937;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 12px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-400);
      align-self: flex-start;
      width: 100%;
      max-width: 720px;
    }

    /* ── DS Avatar 1.5 — XXL (100px) ───────────────────────────── */
    /*
      Spec from Figma node 2333:39093:
      - Size XXL = 100 × 100 px
      - Shape: circle (border-radius: 60px per DS corner-radius token)
      - Background: var(--surface/general/default) = white
      - Border: 1px solid var(--border/default) = #00cc85
      - Icon: Outline/user, centred, OG-Green fill
    */
    .ds-avatar {
      width: 100px;
      height: 100px;
      border-radius: 60px;          /* DS corner-radius/corner-rounded */
      background: var(--white);
      border: 1.5px solid var(--og-green-500);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .ds-avatar svg {
      width: 60px;
      height: 60px;
      stroke: var(--og-green-500);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── School Header Card — Teacher / Pink palette ────────────── */
    .school-card {
      background: var(--pink-50);
      border: 1.5px solid var(--pink-200);
      border-radius: 16px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 720px;
      box-shadow:
        0 2px 16px rgba(255, 92, 152, 0.10),
        0 1px 4px rgba(0, 0, 0, 0.06);
    }

    /* ── Content ─────────────────────────────────────────────────── */
    .school-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .school-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--pink-800);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .school-location {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--pink-600);
      margin-top: -6px;
    }

    .school-location svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      stroke: var(--pink-500);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Stat chips ──────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pink-100);
      border: 1px solid var(--pink-200);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--pink-700);
      white-space: nowrap;
    }

    .stat-chip svg {
      width: 15px;
      height: 15px;
      stroke: var(--pink-500);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .stat-chip strong {
      font-weight: 600;
      color: var(--pink-800);
    }
  </style>
</head>
<body>

  <span class="section-label">Teacher · School Header Card — Pandai DS 1.5</span>

  <div class="school-card">

    <!-- DS Avatar 1.5 — XXL / Icon variant (node 2333:39094) -->
    <div class="ds-avatar">
      <!-- Outline/user — DS icon node 1503:7259 -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>

    <!-- Content: title + subhead + stats -->
    <div class="school-content">

      <div>
        <div class="school-name">Sekolah Menengah Kebangsaan Damansara</div>
        <div class="school-location">
          <!-- Outline/map-pin — DS icon node 1503:7428 -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          Petaling Jaya, Selangor
        </div>
      </div>

      <div class="stats-row">

        <!-- School code — Outline/hash (node 1503:7332) -->
        <div class="stat-chip">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="9" x2="20" y2="9"/>
            <line x1="4" y1="15" x2="20" y2="15"/>
            <line x1="10" y1="3" x2="8" y2="21"/>
            <line x1="16" y1="3" x2="14" y2="21"/>
          </svg>
          <strong>Code</strong> BF0001
        </div>

        <!-- Tel — Outline/phone (node 1503:7333) -->
        <div class="stat-chip">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.59 3.41 2 2 0 0 1 3.55 1.25h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.83a16 16 0 0 0 6.29 6.29l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <strong>Tel</strong> +603-7727 1234
        </div>

        <!-- Address — Outline/map-pin (node 1503:7428) -->
        <div class="stat-chip">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          No. 12, Jalan Damansara
        </div>

      </div>
    </div>
  </div>

</body>
</html>
