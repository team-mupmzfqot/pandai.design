<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandai — Success Modal</title>

  <!-- Poppins — Pandai DS typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       Pandai DS 1.5 — Page Template
       Navigation Shell (Desktop/Tablet/Mobile) + PageViewport placeholder
       Token values confirmed 2026-05-24 (Rules 153–156 / DS audit)
       Source DS: TLVKe3bgJTdVvuPAzgDq2f
    ═══════════════════════════════════════════════════════════════ */
    :root {
      /* Surface */
      --surface-general-default:         #FFFFFF;
      --surface-primary-default:         #00cc85;
      --surface-primary-focus:           #00a36a;   /* Surface/primary/focus — pressed state bg */
      --surface-primary-default-subtle:        #d9f7ed;
      --border-primary-default-subtle:         #d9f7ed;   /* Border/primary/default-subtle — Secondary Active arrow */
      --surface-primary-default-subtle-hover:  #99ebce;
      --surface-secondary-default:             #b5f291;  /* Surface/secondary/default */
      --surface-secondary-default-subtle:      #e8fbe8;  /* Surface/secondary/default-subtle */
      --surface-secondary-default-hover:       #f6fef6;  /* Surface/secondary/default-hover — profile menu header bg */
      --surface-disabled-primary:        #f2f2f2;
      --surface-disabled-on-color:       #e5e5e5;   /* Surface/disabled/on color — disabled button arrow bg (DS confirmed 2026-05-24) */
      --surface-general-default-secondary: #f2f2f2;  /* Surface/general/default-secondary — carousel indicator inactive dot */
      --surface-tertiary-default:        #00564c;   /* Surface/tertiary/default — pressed state bg */
      --surface-informative-default:     #00a2e8;   /* Surface/informative/default — Icon Badge - 1.5 (DS node 3908:1491) */

      /* Border */

      /* Text */
      --text-default-heading:     #404040;
      --text-tertiary-default:    #00564c;   /* Text/tertiary/default — Primary Card header title */
      --text-default-body:        #666666;   /* Text/default/body â€” used in navbar, footer */
      --text-default-secondary:   #6B7280;
      --text-default-placeholder: #f2f2f2;   /* Text/default/placeholder â€” subject badge label */
      --text-primary-default:       #00cc85;
      --text-primary-default-hover: #00a36a;   /* Text/primary/default-hover — Dropdown Selected label */
      --text-primary-on-color:      #ffffff;   /* Text/primary/on-color — Foundation/white (DS updated 2026-05-24, was #e1f9ea) */
      --text-secondary-focus:     #70bc6f;  /* Text/secondary/focus */
      --text-on-color-heading:    #FFFFFF;   /* Text/on-color/heading â€” status pill */
      --text-disabled-default:    #bfbfbf;
      --text-default-caption:     #bfbfbf;   /* Text/default/caption — DS Search placeholder (DS node 1363:2852) */

      /* Icon */
      --icon-default-default:     #808080;   /* Icon/default/default — action icons, inactive (DS confirmed 2026-05-14) */
      --icon-primary-default:     #00cc85;   /* Icon/primary/default — nav button icons, default */
      --icon-secondary-hover:     #70bc6f;   /* Icon/secondary/hover — nav button icons, hover state */
      --icon-primary-on-color:    #ffffff;   /* Icon/primary/on-color — Foundation/white (DS updated 2026-05-24, was #e1f9ea) */
      --icon-tertiary-default:    #00564c;   /* Icon/tertiary/default — pressed arrow chevron */

      /* Border */
      --border-primary-default:   #00cc85;   /* Border/primary/default */
      --border-primary-focus:     #00a36a;   /* Border/primary/focus */
      --border-secondary-default: #b5f291;   /* Border/secondary/default — Focus indicator dot border */
      --border-secondary-focus:   #70bc6f;   /* Border/secondary/focus — hover border on all buttons */
      --border-default:           #00cc85;   /* Border/default â€” navbar, footer, quiz card */
      --border-general-default:   #d9d9d9;   /* Border/general/default — carousel cards */
      --border-tertiary-focus:    #00453d;   /* Border/tertiary/focus — pressed state border */
      --border-disabled-disabled: #bfbfbf;   /* Border/disabled/disabled */
      --border-on-color:          #ffffff;   /* Border/on-color — white border on Number Badge (DS 618:417 updated 2026-05-26) */

      /* Corner Radius (confirmed from design contexts) */
      --corner-radius-corner-pill:    999px;  /* Corner Radius/corner-pill â€” nav row 2 */
      --corner-radius-corner-rounded: 60px;   /* Corner Radius/Corner-Rounded â€” buttons, badges */
      --corner-radius-corner-4xl:     24px;   /* Corner Radius/corner-4xl */
      --corner-radius-corner-2xl:     18px;   /* Corner Radius/corner-2xl â€” quiz card */
      --corner-radius-corner-xl:      16px;   /* Corner Radius/corner-xl â€” carousel cards */
      --corner-radius-corner-lg:      12px;
      --corner-radius-corner-md:      8px;
      --radius-xl:                    8px;   /* Radius/xl (Semantic) — Nav Button - 1.5 (44×44 square) */

      /* Spacing (Semantic) */
      --spacing-space-xxs:  4px;
      --spacing-space-xs:   8px;
      --spacing-space-s:    12px;
      --spacing-space-m:    16px;
      --spacing-space-l:    20px;
      --spacing-space-xl:   24px;
      --spacing-space-2xl:  28px;
      --spacing-space-3xl:  40px;

      /* Scale (Primitives) */
      --scale-25:  1px;
      --scale-50:  2px;
      --scale-200: 8px;

      /* Subject Colors â€” ALL confirmed from DS get_variable_defs */
      --subjects-b-melayu-default:   #4d77ff;   /* Subjects/b-melayu/default */
      --subjects-english-default:    #ff4d56;   /* Subjects/english/default */
      --subjects-math-default:       #42ac7b;   /* Subjects/math/default */
      --subjects-science-default:    #ffd641;   /* Subjects/science/default */
      --subjects-chemistry-default:  #e20082;   /* Subjects/chemistry/default */
      --subjects-physics-default:    #27a0d7;   /* Subjects/physics/default */
      --subjects-history-default:    #a97c50;   /* Subjects/history/default */
      --subjects-geo-default:        #77d836;   /* Subjects/geo/default */
      --subjects-islamic-default:    #de4d7f;   /* Subjects/islamic/default */
      --subjects-moral-default:      #0072ca;   /* Subjects/moral/default */
      --subjects-biology-default:    #8431d8;   /* Subjects/biology/default */
      --subjects-add-math-default:   #283589;   /* Subjects/add-math/default */
      --subjects-economy-default:    #ff5733;   /* Subjects/economy/default */
      --subjects-account-default:    #0072ca;   /* Subjects/account/default */
      --subjects-business-default:   #efb42b;   /* Subjects/business/default */
      --subjects-cs-default:         #d10070;   /* Subjects/comp-science/default */
      --subjects-kafa-default:       #8ae3a9;   /* Subjects/kafa/default */
      --subjects-rbt-default:        #353535;   /* Subjects/rbt/default */

      /* Typography */
      --font-family: 'Poppins', sans-serif;

      /* Layout */
      --page-max-width:          100%;
      --page-padding-x:          60px;
      --nav-dropdown-top:        80px;   /* navbar 72px + 8px gap. Change here to revert. */
      --section-gap:             var(--spacing-space-m);   /* Spacing/space-m = 16px */
      --overlay-dark:            rgba(26, 26, 26, 0.5);    /* Overlay/Overlay-Dark → Foundation/black 50 (DS confirmed) */
      --check-in-card-max-width: 390px;
    }

    /* â”€â”€ Reset â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img  { display: block; }
    a    { text-decoration: none; color: inherit; }
    button { font-family: var(--font-family); cursor: pointer; }
    html { min-width: 390px; height: 100%; }

    body {
      font-family:    var(--font-family);
      background:     var(--surface-general-default);
      color:          var(--text-default-heading);
      width:          100%;
      min-width:      390px;
      max-width:      var(--page-max-width);
      margin:         0 auto;
      padding-bottom: 60px; /* reserve footer height; main-content padding-bottom adds the 16px DS gap */
      min-height:     100vh;
      display:        flex;
      flex-direction: column;
    }

    main {
      flex:           1;
      display:        flex;
      flex-direction: column;
    }

    .page-container {
      width:          100%;
      max-width:      var(--page-max-width);
      margin:         0 auto;
      padding-left:   var(--page-padding-x);
      padding-right:  var(--page-padding-x);
      flex:           1;
      display:        flex;
      flex-direction: column;
    }

    /* DS icon size rules â€” never override unless explicitly stated */
    .icon-ds    { width: 24px; height: 24px; display: block; flex-shrink: 0; }
    .icon-ds-20 { width: 20px; height: 20px; display: block; flex-shrink: 0; }
    .icon-ds-16 { width: 16px; height: 16px; display: block; flex-shrink: 0; }

    /* MAIN CONTENT
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

    .main-content {
      display:        flex;
      flex-direction: column;
      flex:           1;
      gap:            var(--section-gap);    /* 16px between every section */
      padding-top:    var(--section-gap);    /* 16px space at top of page */
      padding-bottom: var(--section-gap);    /* 16px space above footer */
    }
    .footer {
      position:   fixed;
      bottom:     0;
      left:       0;
      right:      0;
      min-width:  390px;
      z-index:    100;
      background: var(--surface-general-default);
      border-top: 1px solid var(--border-default);
    }

    .footer__inner {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      padding:         var(--spacing-space-s) var(--spacing-space-2xl); /* DS: t:12 r:28 b:12 l:28 */
    }

    .footer__left {
      display:     flex;
      align-items: center;
      gap:         var(--spacing-space-xxs);
      flex-shrink: 0;
    }

    .footer__text {
      font-size:   14px;
      font-weight: 500;
      line-height: 20px;
      color:       var(--text-default-body);
      white-space: nowrap;
    }

    .footer__link {
      font-size:   14px;
      font-weight: 500;
      line-height: 20px;
      color:       var(--text-primary-default);
      white-space: nowrap;
      cursor:      pointer;
    }

    .footer__right {
      display:     flex;
      align-items: center;
      gap:         var(--spacing-space-xxs);
      flex-shrink: 0;
    }

    .footer__heart {
      width:       20px;
      height:      20px;
      flex-shrink: 0;
      display:     block;
      color:       var(--icon-primary-default);   /* Icon/primary/default #00cc85 */
    }

    /* ─────────────────────────────────────────────────────
       NAVBAR PRIMARY DESKTOP — Navbar Primary Desktop - 1.5
       DS node 2337:21975 / inner "Navbar Top" 1084:1787
       Logo left · action icons + avatar right
       Border: b/l/r only · radius: 0 0 24px 24px
    ───────────────────────────────────────────────────── */
    #NavbarPrimary-Desktop { display: block; padding: 0 var(--page-padding-x); position: relative; }

    /* Navbar Top (node 1084:1787): flex, gap-28, items-center, px-60, py-8 */
    .navbar-primary {
      background:    var(--surface-general-default);
      border-bottom: 1px solid var(--border-default);
      border-left:   1px solid var(--border-default);
      border-right:  1px solid var(--border-default);
      border-radius: 0 0 var(--corner-radius-corner-4xl) var(--corner-radius-corner-4xl);
      display:       flex;
      align-items:   center;
      gap:           var(--spacing-space-2xl);   /* 28px — Spacing/space-2xl */
      padding:       var(--spacing-space-xs) var(--spacing-space-xl);   /* 8px · 24px — DS px-[Spacing/space-xl] */
      height:        72px;   /* DS Navbar Top = 72px (t:8 + 56px content + b:8) */
      overflow:      visible;   /* must be visible so Union tail (44×52) clears the navbar bottom edge */
    }

    /* Logo/Pandai/Logo Horizontal (node 1898:6965): height-only constraint, width auto */
    .navbar-primary__logo {
      display:     flex;
      align-items: center;
      gap:         4.2px;      /* DS gap: mark right (26.851) → wordmark left (31.055) = 4.204px */
      height:      28px;
      flex-shrink: 0;
    }
    .navbar-primary__logo-mark { display: block; height: 28px;     width: auto; }
    .navbar-primary__logo-text { display: block; height: 19.573px; width: auto; }

    /* Avatar group (node 1084:1836): gap-16, items-center, justify-end, relative
       flex-shrink:0 — margin-left:auto on search frame handles right-push. */
    .navbar-primary__actions {
      display:         flex;
      flex-shrink:     0;
      gap:             var(--spacing-space-m);   /* 16px — Spacing/space-m */
      align-items:     center;
      justify-content: flex-end;
      position:        relative;
    }

    /* ── Navbar Search Bar — Dropdown-Parts/Search (DS node 1342:4370)
          Sits between logo and action buttons, fills all available space.
          Default state: #d9d9d9 border · Focus state: #00cc85 border (Rule 60 — INSIDE stroke = box-shadow:inset) */
    .navbar-search-frame {
      margin-left:    auto;    /* consumes all free space to the left → right edge anchored to actions, grows leftward */
      margin-right:   -20px;   /* flex gap is 28px; -20px reduces effective gap to 8px between bar and search btn */
      flex-shrink:    0;
      display:        flex;
      align-items:    center;
      overflow:       hidden;
      max-width:      0;
      opacity:        0;
      pointer-events: none;
      transition:     max-width 0.3s ease, opacity 0.2s ease;
    }
    .navbar-search-frame.is-open {
      min-width:      600px;
      max-width:      1200px;   /* large enough to never constrain; flex:1 governs actual width */
      opacity:        1;
      pointer-events: auto;
    }

    /* Type=Search / State=Focus (DS node 1366:2119)
       h:40px · pad:8px 12px · rounded-pill · Poppins Medium 14px */
    .navbar-search {
      display:       flex;
      align-items:   center;
      gap:           var(--spacing-space-xs);    /* 8px — DS gap between input and icon */
      width:         100%;
      height:        40px;
      padding:       var(--spacing-space-xs) var(--spacing-space-s);   /* 8px 12px */
      border-radius: var(--corner-radius-corner-pill);   /* 999px — Radius/pill */
      box-shadow:    inset 0 0 0 1px var(--border-general-default);   /* Default: #d9d9d9 */
      background:    var(--surface-general-default);
      transition:    box-shadow 0.15s ease;
      box-sizing:    border-box;
    }
    .navbar-search:focus-within {
      box-shadow: inset 0 0 0 1px var(--border-primary-default);   /* Focus: #00cc85 */
    }

    /* Input field — resets all browser defaults, fills flex row */
    .navbar-search__input {
      flex:        1 0 0;
      min-width:   0;
      border:      none;
      outline:     none;
      background:  transparent;
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 500;   /* Poppins Medium — DS Body/B2 */
      line-height: 20px;
      color:       var(--text-default-body);   /* #666 — Text/default/body */
      padding:     0;
    }
    .navbar-search__input::placeholder {
      color: var(--text-default-caption);   /* #bfbfbf — Text/default/caption */
    }

    /* Search icon — hidden per user request */
    .navbar-search__icon { display: none; }

    /* Row wrapper (DS: flex-row items-center self-stretch) around Top Icons */
    .navbar-primary__icons-wrap {
      display:     flex;
      align-items: center;
      align-self:  stretch;
    }

    /* Top Icons (node 1084:1909): flex, gap-8, h-full, items-center, justify-end, shrink-0 */
    .navbar-primary__icons {
      display:         flex;
      gap:             var(--spacing-space-xs);   /* 8px — Spacing/space-xs */
      height:          100%;
      align-items:     center;
      justify-content: flex-end;
      flex-shrink:     0;
    }

    /* Nav Button - 1.5 (DS node 3908:6148) — outer wrapper, no visual styling
       Structure: button > .nav-btn-content > [.nav-btn-rect + .nav-btn-icon-clip] */
    .navbar-action-btn {
      border:             none;
      background:         transparent;
      padding:            0;
      cursor:             pointer;
      -webkit-appearance: none;
      appearance:         none;
      outline:            none;
      display:            flex;
      align-items:        center;
      justify-content:    center;
      width:              44px;
      height:             44px;
      min-width:          44px;
      flex-shrink:        0;
      position:           relative;
      overflow:           visible;
    }
    .navbar-action-btn:focus        { outline: none; }
    .navbar-action-btn:focus-visible { outline: none; }

    /* Content frame — DS: 44×44, flex items-start justify-between, relative */
    .nav-btn-content {
      position:        relative;
      width:           44px;
      height:          44px;
      display:         flex;
      align-items:     flex-start;
      justify-content: space-between;
      flex-shrink:     0;
    }

    /* Rectangle 10 — DS: bg square, 44×44, 8px radius, state-driven fills */
    .nav-btn-rect {
      width:         44px;
      height:        44px;
      background:    var(--surface-general-default);   /* Default: white */
      border-radius: 8px;
      flex-shrink:   0;
      transition:    background 0.12s ease, box-shadow 0.12s ease;
    }
    .navbar-action-btn:hover     .nav-btn-rect { background: var(--surface-secondary-default-subtle); box-shadow: inset 0 0 0 1px var(--border-primary-default); }
    .navbar-action-btn:active    .nav-btn-rect { background: var(--surface-primary-focus);            box-shadow: inset 0 0 0 1px var(--border-primary-default); }
    .navbar-action-btn.is-pressing .nav-btn-rect { background: var(--surface-primary-focus);          box-shadow: inset 0 0 0 1px var(--border-primary-default); }
    .navbar-action-btn.is-active .nav-btn-rect { background: var(--surface-primary-default); box-shadow: inset 0 0 0 1px var(--border-primary-focus); }

    /* Icon clip — DS: absolute left-50% top-50% translate-center, overflow-clip, 24×24 */
    .nav-btn-icon-clip {
      position:  absolute;
      left:      50%;
      top:       50%;
      transform: translate(-50%, -50%);
      width:     24px;
      height:    24px;
      overflow:  hidden;
      z-index:   1;
    }
    .nav-btn-icon-clip svg {
      display:    block;
      width:      24px;
      height:     24px;
      flex-shrink: 0;
      color:      var(--icon-default-default);   /* Default: #808080 */
      transition: color 0.12s ease;
    }
    .navbar-action-btn:hover     .nav-btn-icon-clip svg { color: var(--icon-primary-default); }
    .navbar-action-btn:active    .nav-btn-icon-clip svg { color: var(--icon-primary-default); }
    .navbar-action-btn.is-pressing .nav-btn-icon-clip svg { color: var(--icon-primary-default); }
    .navbar-action-btn.is-active .nav-btn-icon-clip svg { color: var(--icon-primary-on-color); }   /* Icon/primary/on-color #e1f9ea — DS node 3908:6148 Active */

    /* Number Badge - 1.5 (DS node 618:417, Type=Primary/M)
       20px circle · #00cc85 bg · #ffffff text · 1px white border · 60px radius · 4px padding
       6 types: Primary/Success=#00cc85, Alert=#ff9f43, Warning=#ff4c51, Info=#00a2e8, Tertiary=#f2f2f2
       Positioned absolute top-right over icon — center aligns with icon top-right corner */
    .num-badge {
      position:        absolute;
      top:             1px;
      right:           1px;
      z-index:         2;
      display:         flex;
      align-items:     center;
      justify-content: center;
      height:          20px;
      max-height:      20px;
      min-width:       20px;
      padding:         var(--spacing-space-xxs);        /* 4px — DS Spacing/space-xxs */
      border-radius:   var(--corner-radius-corner-rounded); /* 60px — pill */
      overflow:        hidden;
      font-family:     'Poppins', sans-serif;
      font-size:       10px;
      font-weight:     600;
      line-height:     1;
      text-align:      center;
      white-space:     nowrap;
      pointer-events:  none;
      transition:      opacity 0.15s ease;
    }
    .num-badge--primary {
      background: var(--surface-primary-default);          /* #00cc85 */
      color:      var(--text-primary-on-color);            /* #ffffff */
      box-shadow: 0 0 0 1px var(--border-on-color);        /* 1px white border OUTSIDE (strokeAlign:OUTSIDE) */
    }
    #notif-btn.is-active .num-badge,
    #tablet-notif-btn.is-active .num-badge { opacity: 0; }

    /* Avatar - 1.5 (node 684:621): flex items-start · 48×48 · border · overflow-clip */
    .navbar-avatar {
      display:       flex;
      align-items:   flex-start;
      width:         56px;
      height:        56px;
      min-width:     56px;
      min-height:    56px;
      border-radius: var(--corner-radius-corner-rounded);   /* 60px */
      border:        1px solid var(--border-default);
      background:    var(--surface-general-default);
      overflow:      hidden;
      position:      relative;
      flex-shrink:   0;
      cursor:        pointer;
      user-select:   none;
    }
    /* Outline/user (node 684:622): IMAGE fill · 60×60px · position x:-6 y:0
       DS node inspection: w:60 h:60 x:-6 y:0 fill=IMAGE scaleMode=FILL */
    .navbar-avatar__image {
      position:        absolute;
      inset:           0;
      width:           100%;
      height:          100%;
      object-fit:      cover;
      object-position: center;
      pointer-events:  none;
      display:         block;
    }

    /* DS Avatar - 1.5, Size=L Type=Image = 56×56 frame (includes space for badge) */
    .navbar-avatar-group {
      position:    relative;
      width:       56px;
      height:      56px;
      flex-shrink: 0;
    }
    /* Wrapper for welcome avatar — moves badge outside overflow:hidden circle */
    .welcome-avatar-group {
      position:    relative;
      width:       100px;
      height:      100px;
      min-width:   100px;
      min-height:  100px;
      flex-shrink: 0;
    }
    /* P.Premium badge — absolutely positioned top:0 right:0 of avatar frame.
       Size matches DS: L/Image=16px, XL/Image=20px, XXL/Image=28px */
    .navbar-badge {
      position:        absolute;
      top:             0;
      right:           0;
      width:           20px;   /* DS navbar Content frame: P.Premium = 20×20 */
      height:          20px;
      display:         flex;
      align-items:     center;
      justify-content: center;
      pointer-events:  none;
    }
    .navbar-badge svg { width: 100%; height: 100%; }
    /* XXL/Image (profile dropdown, welcome desktop) */
    .profile-dropdown__avatar-wrap .navbar-badge,
    .welcome-avatar-group .navbar-badge            { width: 28px; height: 28px; }

    /* ─── Profile Menu - 1.5 (DS node 3908:3679)
       320px panel · white bg · 1px #00cc85 border · 24px radius · 16px padding · 8px gap
       Anchored to #NavbarPrimary-Desktop (position:relative) at right:page-padding-x, top:68px
    ─────────────────────────────────────────────────────────────────────────────────────── */
    .profile-dropdown {
      position:       absolute;
      top:            var(--nav-dropdown-top);
      right:          var(--page-padding-x);
      z-index:        500;
      width:          320px;
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);
      padding:        var(--spacing-space-m);
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);

      /* Closed state */
      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .profile-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    /* ─── Learn Menu - 1.5 (DS node 3908:5091)
       364px panel · white bg · 1px #00cc85 border · 24px radius · 16px padding
       Anchored to #NavTopMenu-Desktop (position:relative) below the nav pill
       JS positions .style.right to right-align dropdown to waffle button's right edge
    ─────────────────────────────────────────────────────────────────────── */
    .learn-dropdown {
      position:       absolute;
      top:            var(--nav-dropdown-top);
      right:          0;      /* JS overrides — right-aligned to waffle btn right edge, extends leftward */
      left:           auto;
      z-index:        500;
      width:          365px;  /* DS node 3908:5492: w=365px */
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);
      padding:        var(--spacing-space-m);

      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .learn-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    /* 3×4 grid — DS: grid-cols:3, min-h per cell 114px */
    .learn-dropdown__grid {
      display:               grid;
      grid-template-columns: repeat(3, 1fr);
      gap:                   var(--spacing-space-xs);
    }

    /* Cell — DS State=Default: transparent bg, no border, 12px radius, flex-col, gap 4px, p-8px */
    .learn-dropdown__item {
      display:         flex;
      flex-direction:  column;
      align-items:     center;
      justify-content: center;
      gap:             var(--spacing-space-xxs);
      padding:         var(--spacing-space-xs);
      border-radius:   var(--corner-radius-corner-lg);
      min-height:      114px;
      cursor:          pointer;
      user-select:     none;
      transition:      background 0.12s ease, box-shadow 0.12s ease;
    }

    /* Hover — DS State=Hover: bg #e8fbe8, inset border #00cc85, text #00564c */
    .learn-dropdown__item:hover {
      background: var(--surface-secondary-default-subtle);
      box-shadow: inset 0 0 0 1px var(--border-primary-default);
    }
    .learn-dropdown__item:hover .learn-dropdown__label {
      color: var(--text-tertiary-default);
    }

    /* DS Selected: bg #b5f291, border #70bc6f, text #00564c
       Use :is() to beat :hover specificity so hover doesn't override selected */
    .learn-dropdown__item.is-selected,
    .learn-dropdown__item.is-selected:hover {
      background: var(--surface-secondary-default);
      box-shadow: inset 0 0 0 1px var(--border-secondary-focus);
    }
    .learn-dropdown__item.is-selected .learn-dropdown__label,
    .learn-dropdown__item.is-selected:hover .learn-dropdown__label {
      color: var(--text-tertiary-default);
    }

    /* 70×70 illustrated icon — PNG per Rule 50 */
    .learn-dropdown__icon {
      width:      70px;
      height:     70px;
      object-fit: contain;
      display:    block;
      flex-shrink: 0;
    }

    /* Label — DS node 3908:2464: 14px SemiBold, Text/default/body #666 */
    .learn-dropdown__label {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);
      text-align:  center;
      transition:  color 0.12s ease;
    }

    /* Header: light mint bg, 1px green border, 16px radius, py 16px, items centered */
    .profile-dropdown__header {
      background:     var(--surface-secondary-default-hover);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-2xl);
      padding:        var(--spacing-space-m) 0;
      display:        flex;
      flex-direction: column;
      gap:            10px;
      align-items:    center;
      width:          100%;
    }

    /* Avatar wrapper — 100×100, holds absolute badge */
    .profile-dropdown__avatar-wrap {
      position:   relative;
      width:      100px;
      height:     100px;
      flex-shrink: 0;
    }
    .profile-dropdown__avatar {
      width:         100px;
      height:        100px;
      border-radius: var(--corner-radius-corner-rounded);
      border:        1px solid var(--border-default);
      background:    var(--surface-general-default);
      overflow:      hidden;
    }
    .profile-dropdown__avatar img {
      width:    100%;
      height:   100%;
      object-fit: cover;
      display:  block;
    }

    /* Name / username block */
    .profile-dropdown__info {
      display:        flex;
      flex-direction: column;
      align-items:    center;
      width:          100%;
      gap:            0;
    }
    .profile-dropdown__name-row {
      display:         flex;
      gap:             var(--spacing-space-xxs);
      align-items:     center;
      justify-content: center;
    }
    .profile-dropdown__name {
      font-size:   18px;
      font-weight: 700;
      line-height: 28px;
      color:       var(--text-tertiary-default);
      white-space: nowrap;
    }
    /* Icon Badge - 1.5: 12×12, blue, 1px white OUTSIDE stroke, 2px padding
       strokeAlign:OUTSIDE → box-shadow NO inset (Rule 60).
       border-box: 12px − 4px padding = 8px icon area. Stroke renders outside bounds. */
    .profile-dropdown__verified {
      width:           12px;
      height:          12px;
      background:      var(--surface-informative-default);
      box-shadow:      0 0 0 1px var(--border-on-color);
      border-radius:   var(--corner-radius-corner-rounded);
      display:         inline-flex;
      align-items:     center;
      justify-content: center;
      flex-shrink:     0;
      overflow:        hidden;
      padding:         2px;
      color:           white;
    }
    .profile-dropdown__username {
      font-size:   12px;
      font-weight: 500;
      line-height: 12px;
      color:       var(--text-default-body);
      white-space: nowrap;
    }
    /* Pill Badge - 1.5: white bg, 1px green border, pill radius */
    .profile-dropdown__plan {
      background:    var(--surface-general-default);
      border:        1px solid var(--border-primary-default);
      border-radius: var(--corner-radius-corner-rounded);
      padding:       2px var(--spacing-space-xs);
      font-size:     10px;
      font-weight:   500;
      line-height:   12px;
      color:         var(--text-primary-default);
      white-space:   nowrap;
    }
    /* Upgrade link: Filled/star icon + text, gap 8px */
    .profile-dropdown__upgrade {
      display:     flex;
      gap:         var(--spacing-space-xs);
      align-items: center;
      color:       var(--text-primary-default);
      font-size:   14px;
      font-weight: 400;
      line-height: 20px;
      white-space: nowrap;
      cursor:      pointer;
    }
    .profile-dropdown__upgrade svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--icon-primary-default); }

    /* Menu section */
    .profile-dropdown__menu {
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);
      width:          100%;
      background:     var(--surface-general-default);
    }
    /* Dropdown - Parts (DS node 1342:4370, Type=Check List/Main List)
       Default: plain row · Hover: #e8fbe8 bg + 1px #00cc85 border + pill radius + green label
       Active: #b5f291 bg + 1px #00a36a border (Selected palette) */
    .profile-dropdown__item {
      display:       flex;
      gap:           10px;
      align-items:   center;
      padding:       var(--spacing-space-xs) var(--spacing-space-m);   /* 8px 16px */
      cursor:        pointer;
      border-radius: var(--corner-radius-corner-pill);   /* 108px — pill on hover per DS */
      user-select:   none;
      transition:    background 0.12s ease, box-shadow 0.12s ease;
    }
    /* Hover — Surface/secondary/default-subtle #e8fbe8 · 1px Border/primary/default #00cc85 */
    .profile-dropdown__item:hover {
      background: var(--surface-secondary-default-subtle);
      box-shadow: inset 0 0 0 1px var(--border-primary-default);
    }
    .profile-dropdown__item:hover .profile-dropdown__item-label {
      color: var(--text-primary-default);   /* #00cc85 — Text/primary/default */
    }
    /* Active/Pressed — Selected-state palette: Surface/secondary/default #b5f291 · Border/primary/focus #00a36a */
    .profile-dropdown__item:active {
      background: var(--surface-secondary-default);
      box-shadow: inset 0 0 0 1px var(--border-primary-focus);
    }
    .profile-dropdown__item:active .profile-dropdown__item-label {
      color: var(--border-primary-focus);   /* #00a36a — Text/primary/default-hover */
    }
    .profile-dropdown__item-icon { width: 24px; height: 24px; flex-shrink: 0; color: var(--icon-primary-default); }
    .profile-dropdown__item-icon svg { display: block; width: 24px; height: 24px; }
    .profile-dropdown__item-label {
      flex:        1 0 0;
      min-width:   1px;
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);   /* #666 — Text/default/body */
      transition:  color 0.12s ease;
    }
    /* Divider — 1px horizontal line */
    .profile-dropdown__divider {
      height:     1px;
      background: var(--border-general-default);
      width:      100%;
      flex-shrink: 0;
    }

    /* ─── Localization dropdown (DS node 3928:3067, Navbar Download Apps - 1.5)
       204px panel · white bg · 1px #00cc85 border · 24px radius · 16px padding
       Right-aligned to EN button via JS positionDropdown · top: var(--nav-dropdown-top)
    ─────────────────────────────────────────────────────────────────────────── */
    .locale-dropdown {
      position:       absolute;
      top:            var(--nav-dropdown-top);
      right:          0;
      left:           auto;
      z-index:        500;
      width:          204px;
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);
      padding:        var(--spacing-space-m);
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);

      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .locale-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    /* Dropdown - Parts (DS 1342:4370) — py-8 px-16, gap-10, border-radius 108px (Radius/pill)
       border: transparent in default prevents 2px layout shift when border appears on hover */
    .locale-dropdown__item {
      display:       flex;
      gap:           10px;
      align-items:   center;
      padding:       var(--spacing-space-xs) var(--spacing-space-m);
      border:        1px solid transparent;
      border-radius: 108px;
      cursor:        pointer;
      user-select:   none;
      transition:    background 0.12s ease, border-color 0.12s ease;
    }
    /* Hover — DS node 1363:2881: bg #e8fbe8 · border #00cc85 · label #00cc85 */
    .locale-dropdown__item:hover                           { background: var(--surface-secondary-default-subtle); border-color: var(--border-primary-default); }
    .locale-dropdown__item:hover .locale-dropdown__label  { color: var(--text-primary-default); }
    /* Selected — DS node 1363:2887: bg #b5f291 · border #00a36a · label #00a36a */
    .locale-dropdown__item.is-selected,
    .locale-dropdown__item.is-selected:hover               { background: var(--surface-secondary-default); border-color: var(--border-primary-focus); }
    .locale-dropdown__item.is-selected .locale-dropdown__label,
    .locale-dropdown__item.is-selected:hover .locale-dropdown__label { color: var(--text-primary-default-hover); }
    /* Label: Body/B1 — 14px SemiBold, Text/default/body #666 */
    .locale-dropdown__label {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);
      transition:  color 0.12s ease;
    }

    /* ─── Notification dropdown (DS node 3908:13057, Navbar Notification - 1.5)
       320px panel · white bg · 1px #00cc85 border · 24px radius · 16px padding
       Right-aligned to bell button via JS · top: var(--nav-dropdown-top) · same animation as all other dropdowns
    ──────────────────────────────────────────────────────────────────────────────────────── */
    .notif-dropdown {
      position:       fixed;
      top:            0;
      left:           0;
      right:          auto;
      z-index:        500;
      width:          320px;
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);
      padding:        var(--spacing-space-m);
      display:        flex;
      flex-direction: column;

      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .notif-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    /* Notifications List — DS node 6305:45076: flex-col, gap 8px between items */
    .notif-list {
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);
    }

    /* Navbar Notification Button - Parts (DS 3908:13427/13443/13456) */
    .notif-item {
      cursor:      pointer;
      user-select: none;
      overflow:    hidden;                                    /* needed for max-height collapse */
    }
    /* Content frame — Default: white, pt-12 px-12 pb-0, no border */
    .notif-item__content {
      display:       flex;
      background:    var(--surface-general-default);
      padding:       var(--spacing-space-s) var(--spacing-space-s) 0;
      border-radius: 0;
      transition:    background 0.12s ease, box-shadow 0.12s ease, border-radius 0.12s ease, padding 0.12s ease;
    }
    /* Inner row — Default: gap-8, pb-12, 1px bottom divider #d9d9d9 */
    .notif-item__body {
      display:        flex;
      flex:           1 0 0;
      min-width:      0;
      gap:            var(--spacing-space-xs);
      align-items:    flex-start;
      padding-bottom: var(--spacing-space-s);
      border-bottom:  1px solid var(--border-general-default);
      transition:     border-color 0.12s ease, padding-bottom 0.12s ease;
    }
    /* Hover — Surface/secondary/default-hover #f6fef6 · 1px #00cc85 inset · 16px radius */
    .notif-item:hover .notif-item__content {
      background:    var(--surface-secondary-default-hover);
      box-shadow:    inset 0 0 0 1px var(--border-primary-default);
      border-radius: var(--corner-radius-corner-xl);
      padding:       var(--spacing-space-s);
    }
    .notif-item:hover .notif-item__body {
      border-bottom-color: transparent;
      padding-bottom:      0;
    }
    .notif-item:hover .notif-item__text { color: var(--text-tertiary-default); }
    /* Focus — DS node 3908:13456: Surface/secondary/default #b5f291 · 1px Border/secondary/focus #70bc6f · 16px radius */
    .notif-item:active .notif-item__content,
    .notif-item:focus-visible .notif-item__content {
      background:    var(--surface-secondary-default);
      box-shadow:    inset 0 0 0 1px var(--border-secondary-focus);
      border-radius: var(--corner-radius-corner-xl);
      padding:       var(--spacing-space-s);
    }
    .notif-item:active .notif-item__body,
    .notif-item:focus-visible .notif-item__body {
      border-bottom-color: transparent;
      padding-bottom:      0;
    }
    .notif-item:active .notif-item__text,
    .notif-item:focus-visible .notif-item__text { color: var(--text-tertiary-default); }
    .notif-item:active .notif-item__time,
    .notif-item:focus-visible .notif-item__time { color: var(--text-secondary-focus); }
    .notif-item:active .notif-item__dot,
    .notif-item:focus-visible .notif-item__dot  { box-shadow: 0 0 0 1px var(--border-secondary-default); }

    /* Avatar — 60×60 clip, user-circle at 50px (DS inset 8.33% = 5px each side) */
    .notif-item__avatar {
      width:           60px;
      height:          60px;
      flex-shrink:     0;
      overflow:        hidden;
      display:         flex;
      align-items:     center;
      justify-content: center;
      color:           var(--icon-primary-default);
    }
    .notif-item__avatar svg { width: 50px; height: 50px; flex-shrink: 0; }

    /* Text stack */
    .notif-item__texts       { display: flex; flex: 1 0 0; min-width: 0; align-items: flex-start; }
    .notif-item__texts-inner { display: flex; flex: 1 0 0; flex-direction: column; gap: 4px; min-width: 0; max-width: 205px; }
    .notif-item__text {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);
      word-break:  break-word;
      transition:  color 0.12s ease;
    }
    .notif-item__time {
      font-family: var(--font-family);
      font-size:   10px;
      font-weight: 500;
      line-height: 12px;
      color:       var(--text-primary-default);
      white-space: nowrap;
    }
    /* Unread indicator — Indicator Badge - 1.5: 8×8, #00cc85 bg, 1px white OUTSIDE stroke (DS strokeAlign:OUTSIDE) */
    .notif-item__indicator { display: flex; align-items: flex-start; padding-top: 4px; flex-shrink: 0; }
    .notif-item__dot {
      width:         8px;
      height:        8px;
      border-radius: var(--corner-radius-corner-rounded);
      background:    var(--surface-primary-default);
      box-shadow:    0 0 0 1px var(--border-on-color);   /* strokeAlign:OUTSIDE → no inset; #ffffff */
      flex-shrink:   0;
    }

    /* Read state (click 1): fade out indicator dot */
    .notif-item__indicator           { transition: opacity 0.2s ease; }
    .notif-item.is-read .notif-item__indicator { opacity: 0; pointer-events: none; }

    /* "See all notification" — Primary/L Button - 1.5, no arrow, full-width */
    .notif-dropdown__footer {
      padding-top: var(--spacing-space-m);
      width:       100%;
      transition:  padding-top 0.3s ease;
    }
    /* When all items are dismissed, drop footer padding (dropdown's own 16px padding is enough) */
    .notif-dropdown.is-empty .notif-dropdown__footer { padding-top: 0; }
    .notif-see-all {
      display:         flex;
      align-items:     center;
      justify-content: center;
      width:           100%;
      height:          40px;
      padding:         8px var(--spacing-space-s);
      background:      var(--surface-primary-default);
      border:          1px solid var(--border-primary-focus);
      border-radius:   var(--corner-radius-corner-rounded);
      cursor:          pointer;
      user-select:     none;
      font-family:     var(--font-family);
      font-size:       14px;
      font-weight:     600;
      line-height:     20px;
      color:           var(--text-primary-on-color);
      transition:      background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .notif-see-all:hover  { background: var(--surface-secondary-default); border-color: var(--border-secondary-focus); color: var(--text-secondary-focus); }
    .notif-see-all:active { background: var(--surface-primary-focus);    border-color: var(--border-primary-default); color: var(--text-primary-default); }

    /* ─── Download Apps dropdown (DS node 3909:3405, Navbar Download Apps - 1.5)
       238px panel · white bg · 1px #00cc85 border · 24px radius · 16px padding
       3 items: Google Android, Apple iOS, Huawei · Right-aligned to smartphone button
    ─────────────────────────────────────────────────────────────────────────── */
    .download-dropdown {
      position:       absolute;
      top:            var(--nav-dropdown-top);
      right:          0;
      left:           auto;
      z-index:        500;
      width:          238px;
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);
      padding:        var(--spacing-space-m);
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);

      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .download-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }
    /* Dropdown - Parts (DS 1342:4370) — py-8 px-16, gap-10, border-radius 108px (Radius/pill)
       border: transparent in default prevents 2px layout shift when border appears on hover */
    .download-dropdown__item {
      display:       flex;
      gap:           10px;
      align-items:   center;
      padding:       var(--spacing-space-xs) var(--spacing-space-m);
      border:        1px solid transparent;
      border-radius: 108px;
      cursor:        pointer;
      user-select:   none;
      transition:    background 0.12s ease, border-color 0.12s ease;
    }
    /* Hover — DS node 1363:2881: bg #e8fbe8 · border #00cc85 · label #00cc85 */
    .download-dropdown__item:hover                            { background: var(--surface-secondary-default-subtle); border-color: var(--border-primary-default); }
    .download-dropdown__item:hover .download-dropdown__label  { color: var(--text-primary-default); }
    /* Store icon — SVG <use> symbol, 24×24 CSS box (Rule 36: all icons must be symbols)
       Google Play viewBox is 0 0 24 27 — SVG preserveAspectRatio="xMidYMid meet" letterboxes it */
    .download-dropdown__icon {
      width:       24px;
      height:      24px;
      flex-shrink: 0;
      display:     block;
      overflow:    visible;
    }
    /* <a> reset — suppress browser focus ring and visited color shift on download items */
    .download-dropdown__item:focus        { outline: none; }
    .download-dropdown__item:focus-visible { outline: none; }
    .download-dropdown__item:visited .download-dropdown__label { color: var(--text-default-body); }
    /* Label — Body/B1, 14px SemiBold, Text/default/body #666, w-140px */
    .download-dropdown__label {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);
      width:       140px;
      transition:  color 0.12s ease;
    }

    #NavTopMenu-Desktop {
      display:    block;
      padding:    0 var(--page-padding-x);   /* follows page padding — 60px desktop / 32px tablet / 16px mobile */
      margin-top: var(--spacing-space-m);   /* 16px — DS confirmed: Navbar y:0 h:64, NavMenu y:80 → gap = 16px */
      position:   relative;                  /* anchor for .nav-menu-dropdown absolute children */
      overflow:   visible;                   /* allow dropdown to extend below the 56px pill height */
    }

    /* Pill container: h:56px, full border, radius 999px — DS 3406:802 */
    .navbar-nav-menu {
      background:    var(--surface-general-default);
      border:        1px solid var(--border-default);
      border-radius: var(--corner-radius-corner-pill);   /* 999px */
      height:        56px;
      max-height:    64px;
      padding:       var(--spacing-space-xs);   /* 8px all sides — DS p-[Spacing/space-xs] */
      display:       flex;
      align-items:   center;                             /* DS items-center on Navbar Content */
      gap:           var(--spacing-space-xs);   /* 8px between buttons — DS Content gap */
    }

    /* Each nav button — <div> per existing implementation (Rule 13 cursor + user-select) */
    .nav-menu-btn {
      display:     flex;
      cursor:      pointer;
      user-select: none;
      flex-shrink: 0;
    }

    /* Inner pill — receives hover/active bg. Default: explicit white (DS bg-white per button) */
    .nav-menu-btn__inner {
      display:       flex;
      align-items:   center;
      gap:           0;
      padding:       var(--spacing-space-xs) var(--spacing-space-s);   /* 8px 12px — DS py-space-xs px-space-s */
      border-radius: var(--corner-radius-corner-rounded);   /* 60px — DS rounded-corner-rounded */
      min-height:    24px;
      background:    var(--surface-general-default);       /* DS bg-[var(--surface/general/default)] */
    }

    /* Icon wrapper: 24×24 flex center (contains the 20×20 clip) */
    .nav-menu-btn__icon-wrap {
      width:           24px;
      height:          24px;
      display:         flex;
      align-items:     center;
      justify-content: center;
      flex-shrink:     0;
    }

    /* Icon clip: 20×20, overflow hidden, per-icon inset padding */
    .nav-menu-btn__icon-clip {
      width:       20px;
      height:      20px;
      overflow:    hidden;
      box-sizing:  border-box;
      flex-shrink: 0;
      color:       var(--icon-primary-default);   /* #00cc85 default */
    }
    .nav-menu-btn__icon-clip svg { display: block; width: 100%; height: 100%; }

    /* No per-icon padding — DS icons (node 3406:802) use viewBox="0 0 20 20" with natural
       margins baked into path coords. Clip padding was removed May 2026 after DS audit. */

    /* Text label: Body/B1 — 14px SemiBold, #666, px:8px */
    .nav-menu-btn__label {
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);   /* #666 */
      padding:     0 var(--spacing-space-xs);   /* 0 8px */
      white-space: nowrap;
    }

    /* Chevron clip: 16×16, no padding — path baked into viewBox="0 0 16 16" at clip-space coords */
    .nav-menu-btn__chevron-clip {
      width:       16px;
      height:      16px;
      overflow:    hidden;
      flex-shrink: 0;
      color:       var(--icon-primary-default);
    }
    .nav-menu-btn__chevron-clip svg { display: block; width: 100%; height: 100%; }

    /* Hover — Secondary palette (DS node 538:2091) */
    .nav-menu-btn:hover .nav-menu-btn__inner {
      background: var(--surface-secondary-default);
      box-shadow: inset 0 0 0 1px var(--border-secondary-focus);
    }
    .nav-menu-btn:hover .nav-menu-btn__label,
    .nav-menu-btn:hover .nav-menu-btn__icon-clip,
    .nav-menu-btn:hover .nav-menu-btn__chevron-clip { color: var(--text-secondary-focus); }

    /* Pressed — JS class is-pressing (Rule 39: JS mousedown on <div>) */
    /* DS node 3029:20022 — Surface/primary/focus #00a36a, Border/primary/default #00cc85 */
    .nav-menu-btn.is-pressing .nav-menu-btn__inner {
      background: var(--surface-primary-focus);
      box-shadow: inset 0 0 0 1px var(--border-primary-default);
    }
    .nav-menu-btn.is-pressing .nav-menu-btn__label,
    .nav-menu-btn.is-pressing .nav-menu-btn__icon-clip,
    .nav-menu-btn.is-pressing .nav-menu-btn__chevron-clip { color: var(--text-primary-default); }

    /* Selected/Active — State=Selected: Primary palette (DS node 538:2083) */
    .nav-menu-btn.is-active .nav-menu-btn__inner {
      background: var(--surface-primary-default);
      box-shadow: inset 0 0 0 1px var(--border-primary-focus);
    }
    .nav-menu-btn.is-active .nav-menu-btn__label,
    .nav-menu-btn.is-active .nav-menu-btn__icon-clip,
    .nav-menu-btn.is-active .nav-menu-btn__chevron-clip { color: var(--text-primary-on-color); }

    /* ─── Nav Top Menu Dropdowns — Dropdown - Parts (DS node 2185:42800)
       Anchored to #NavTopMenu-Desktop (position:relative).
       JS left-aligns each dropdown to its triggering .nav-menu-btn.
       Same 0.15s snappy animation as all other navbar dropdowns.
    ──────────────────────────────────────────────────────────────────── */
    .nav-menu-dropdown {
      position:       absolute;
      top:            64px;   /* 56px pill + 8px gap */
      left:           0;      /* JS overrides per button */
      z-index:        500;
      width:          242px;  /* 16px pad × 2 + 210px item */
      background:     var(--surface-general-default);
      border:         1px solid var(--border-primary-default);
      border-radius:  var(--corner-radius-corner-4xl);   /* 24px */
      padding:        var(--spacing-space-m);            /* 16px */

      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .nav-menu-dropdown.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    /* Vertical list of Dropdown - Parts items */
    .nav-menu-dropdown__list {
      display:        flex;
      flex-direction: column;
      gap:            var(--spacing-space-xs);   /* 8px — DS gap-[Spacing/space-xs] */
    }

    /* Each item — DS: 210px wide, flex row, gap 10px, pad 8px/16px, radius 108px pill */
    .nav-menu-dropdown__item {
      display:       flex;
      align-items:   center;
      gap:           10px;
      padding:       var(--spacing-space-xs) var(--spacing-space-m);   /* 8px 16px */
      border-radius: 108px;                  /* Radius/pill — DS rounded-corner-pill */
      border:        1px solid transparent;  /* prevents layout shift when hover border appears */
      width:         210px;
      cursor:        pointer;
      user-select:   none;
      transition:    background 0.12s ease, border-color 0.12s ease;
    }

    /* Hover — DS State=Hover: bg #e8fbe8, border #00cc85, label #00cc85 (Rule 56) */
    .nav-menu-dropdown__item:hover {
      background:   var(--surface-secondary-default-subtle);
      border-color: var(--border-primary-default);
    }
    .nav-menu-dropdown__item:hover .nav-menu-dropdown__label { color: var(--text-primary-default); }

    /* Selected — DS State=Selected: bg #b5f291, border #70bc6f, label #00a36a (Rule 56) */
    .nav-menu-dropdown__item.is-selected,
    .nav-menu-dropdown__item.is-selected:hover {
      background:   var(--surface-secondary-default);
      border-color: var(--border-secondary-focus);
    }
    .nav-menu-dropdown__item.is-selected .nav-menu-dropdown__label,
    .nav-menu-dropdown__item.is-selected:hover .nav-menu-dropdown__label { color: var(--text-primary-default-hover); }

    /* Icon — 24×24 clip, overflow:hidden, color inherits → currentColor on SVG stroke */
    .nav-menu-dropdown__icon {
      width:       24px;
      height:      24px;
      overflow:    hidden;
      flex-shrink: 0;
      color:       var(--icon-primary-default);   /* #00cc85 */
    }
    .nav-menu-dropdown__icon svg { display: block; width: 100%; height: 100%; }

    /* Label — Body/B1: 14px SemiBold, #666, transitions on hover/selected */
    .nav-menu-dropdown__label {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);   /* #666 */
      white-space: nowrap;
      transition:  color 0.12s ease;
    }

    /* ─────────────────────────────────────────────────────
       MOBILE NAVBAR — DS node 1943:22641 (Type=Mobile)
       Single row, h:68, pad: t:20 r:24 b:20 l:24
       Logo left, hamburger icon right
    ───────────────────────────────────────────────────── */
    .navbar-mobile {
      height:          64px;
      background:      var(--surface-general-default);
      border-bottom:   1px solid var(--border-primary-default);
      border-left:     1px solid var(--border-primary-default);
      border-right:    1px solid var(--border-primary-default);
      border-radius:   0 0 var(--corner-radius-corner-4xl) var(--corner-radius-corner-4xl);
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      padding:         var(--spacing-space-m) 24px;   /* DS: t:16 r:24 b:16 l:24 */
    }

    .navbar-mobile__logo {
      display:     flex;
      align-items: center;
      gap:         4.2px;      /* matches desktop — DS: 4.204px */
      height:      28px;
    }
    .navbar-mobile__logo-mark { display: block; height: 28px;     width: auto; }
    .navbar-mobile__logo-text { display: block; height: 19.573px; width: auto; }

    /* DS Menu Icon frame (1943:22623): HORIZONTAL, gap=8px — bell + hamburger */
    .navbar-mobile__buttons {
      display:     flex;
      align-items: center;
      gap:         8px;
    }

    /* .navbar-mobile__menu-btn removed — button now uses .navbar-action-btn (Nav Button - 1.5, 44×44) */

    /* ─────────────────────────────────────────────────────
       HAMBURGER → X ANIMATION
       3 separate <path> elements, each with explicit transform-origin
       in the 24×24 SVG coordinate space. translateY moves line to
       center (y=12), then rotate forms the X arms.
    ───────────────────────────────────────────────────── */
    /* transform-box:view-box makes % origins relative to the SVG viewport (0 0 24 24),
       not the path's own fill-box. With fill-box (browser default), 12px 6px resolves
       to the wrong pivot point, causing paths to rotate out of bounds and shift layout.
       overflow:hidden on .ham-svg clamps any residual ink overflow so it never
       contributes to the button's or navbar's measured width. */
    .ham-svg { overflow: hidden; display: block; }
    .ham-top { transform-box: view-box; transform-origin: 50% 25%; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .ham-mid { transform-box: view-box; transform-origin: 50% 50%; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease; }
    .ham-bot { transform-box: view-box; transform-origin: 50% 75%; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    /* 50% 25% = (12,6) · 50% 50% = (12,12) · 50% 75% = (12,18) in 24×24 viewport */
    #tablet-menu-btn.is-open .ham-top { transform: translateY(6px)  rotate(45deg);  }
    #tablet-menu-btn.is-open .ham-mid { opacity: 0; transform: scaleX(0); }
    #tablet-menu-btn.is-open .ham-bot { transform: translateY(-6px) rotate(-45deg); }

    /* ─────────────────────────────────────────────────────
       NAV MENU TABLET — Nav Menu Tablet - 1.5 (DS node 3427:4590)
       White panel · border L/R/B #00cc85 · no top border
       Rounded bottom corners 24px · position absolute under #NavBar-Mobile
       Slides down (opacity+translateY) · z-index 300
    ───────────────────────────────────────────────────── */
    /* #NavBar-Mobile raised to z-index 300 so it paints above the tablet overlay (z-index 250).
       Dropdown (#NavMenu-Tablet) is a sibling element — position:fixed so it uses the viewport
       as containing block (position:absolute;top:100% would resolve to ICB, placing it off-screen). */
    #NavBar-Mobile { position: relative; z-index: 300; }

    /* Tablet fullscreen overlay — Overlay/Overlay-Dark = rgba(26,26,26,0.5)
       Sits between page content (z-index 0) and navbar+dropdown (z-index 300).
       Same snappy transition as desktop navbar dropdowns (0.15s ease). */
    .tablet-overlay {
      position:       fixed;
      inset:          0;
      z-index:        250;
      background:     var(--overlay-dark);
      opacity:        0;
      pointer-events: none;
      visibility:     hidden;
    }
    .tablet-overlay.is-open {
      opacity:        1;
      pointer-events: auto;
      visibility:     visible;
    }

    .nav-menu-tablet {
      /* Fixed below the 64px navbar — works regardless of DOM position (sibling of #NavBar-Mobile).
         position:absolute would resolve to the ICB since the containing block is not the navbar. */
      position:       fixed;
      top:            0;
      left:           var(--page-padding-x);
      right:          var(--page-padding-x);
      z-index:        300;
      background:     var(--surface-general-default);
      border-bottom:  1px solid var(--border-primary-default);
      border-left:    1px solid var(--border-primary-default);
      border-right:   1px solid var(--border-primary-default);
      border-radius:  0 0 var(--corner-radius-corner-4xl) var(--corner-radius-corner-4xl);
      overflow:       hidden;
      padding:        var(--spacing-space-m);
      box-sizing:     border-box;
      display:        flex;
      flex-direction: column;
      opacity:        0;
      transform:      translateY(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .nav-menu-tablet.is-open {
      opacity:        1;
      transform:      translateY(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }

    .nav-menu-tablet__header {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      gap:             10px;
      padding:         0 var(--spacing-space-m) var(--spacing-space-m);
      background:      var(--surface-general-default);
    }
    .nav-menu-tablet__logo { display: flex; align-items: center; }
    .nav-menu-tablet__close {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      color:      var(--icon-default-default);
      background: none; border: none; padding: 0;
      cursor:     pointer;
    }
    .nav-menu-tablet__close:hover { color: var(--icon-primary-default); }

    .nav-menu-tablet__search { padding: 0 var(--spacing-space-m); }
    .nav-menu-tablet__search-btn {
      display:       flex;
      align-items:   center;
      gap:           10px;
      width:         100%;
      height:        40px;
      padding:       var(--spacing-space-xs) var(--spacing-space-s);
      background:    var(--surface-general-default);
      border:        none;
      box-shadow:    inset 0 0 0 1px var(--border-general-default);
      border-radius: var(--corner-radius-corner-pill);
      cursor:        pointer;
    }
    .nav-menu-tablet__search-btn:hover { box-shadow: inset 0 0 0 1px var(--border-primary-default); }
    .nav-menu-tablet__search-text {
      flex:        1 0 0;
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 500;
      line-height: 20px;
      color:       var(--border-general-default);
      text-align:  left;
    }
    .nav-menu-tablet__search-icon { display: flex; flex-shrink: 0; color: var(--icon-default-default); }
    .nav-menu-tablet__search-icon svg { width: 24px; height: 24px; display: block; }

    .nav-menu-tablet__menu {
      display:    flex;
      gap:        var(--spacing-space-xs);
      padding:    var(--spacing-space-m);
      background: var(--surface-general-default);
    }
    .nav-menu-tablet__col { display: flex; flex-direction: column; gap: var(--spacing-space-xs); flex: 1 0 0; min-width: 0; }
    /* 32px-wide spacer with a centred 1px divider line */
    .nav-menu-tablet__divider { width: 32px; flex-shrink: 0; position: relative; align-self: stretch; }
    .nav-menu-tablet__divider::after {
      content:    '';
      position:   absolute;
      left:       50%;
      top:        0;
      bottom:     0;
      width:      1px;
      background: var(--border-general-default);
      transform:  translateX(-50%);
    }

    /* Shared menu items — used in both tablet and mobile menus */
    .nav-menu-item {
      display:       flex;
      align-items:   center;
      gap:           10px;
      padding:       var(--spacing-space-xs) var(--spacing-space-m);
      border-radius: 0;
      cursor:        pointer;
      user-select:   none;
      transition:    background 0.12s ease, border-radius 0.12s ease, box-shadow 0.12s ease;
    }
    .nav-menu-item:hover { background: var(--surface-secondary-default-subtle); box-shadow: inset 0 0 0 1px var(--border-primary-default); border-radius: 108px; }
    .nav-menu-item:hover .nav-menu-item__label { color: var(--text-primary-default); }
    .nav-menu-item:hover .nav-menu-item__arrow { color: var(--icon-primary-default); }
    .nav-menu-item.is-active { background: var(--surface-secondary-default); box-shadow: inset 0 0 0 1px var(--border-primary-focus); border-radius: 108px; }
    .nav-menu-item.is-active .nav-menu-item__label { color: var(--text-primary-default-hover); }
    .nav-menu-item__icon  { display: flex; flex-shrink: 0; color: var(--icon-primary-default); }
    .nav-menu-item__icon svg { width: 24px; height: 24px; display: block; }
    .nav-menu-item__label {
      flex:        1 0 0;
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      line-height: 20px;
      color:       var(--text-default-body);
      transition:  color 0.12s ease;
    }
    .nav-menu-item__arrow { display: flex; flex-shrink: 0; color: var(--icon-default-default); transition: color 0.12s ease; }
    .nav-menu-item__arrow svg { width: 24px; height: 24px; display: block; }

    /* DS nav menu items have no checkbox indicator — active state uses pill background only */
    .nav-menu-check { display: none; }

.nav-menu-item.has-submenu.is-open {
      background:    var(--surface-secondary-default);
      box-shadow:    inset 0 0 0 1px var(--border-primary-focus);
      border-radius: 108px;
    }
    .nav-menu-item.has-submenu.is-open .nav-menu-item__label { color: var(--text-primary-default-hover); }
    .nav-menu-item.has-submenu.is-open .nav-menu-item__icon  { color: var(--icon-primary-default); }
    .nav-menu-item.has-submenu.is-open .nav-menu-item__arrow { color: var(--icon-primary-default); }
    .nav-menu-item.has-submenu .nav-menu-item__arrow svg { transition: transform 0.15s ease; }
    .nav-menu-item.has-submenu.is-open .nav-menu-item__arrow svg { transform: rotate(90deg); }

    /* DS Sub-topic: gap=8px, pl=16px, pr=16px, pt=0, pb=0 (tablet) / pb=16px (mobile).
       DS nodes: tablet 5283:118410 (pt:0 pb:0), mobile 5283:122098 (pt:0 pb:16).
       margin-top:-8px cancels the flex column's phantom gap when height=0 (flat layout).
       Tablet open: margin stays -8px; sub-item py:8px provides the trigger→sub-item gap.
       Mobile open: margin restores to 0; flex gap provides the trigger→sub-item gap. */
    .nav-menu-submenu {
      display:         flex;
      flex-direction:  column;
      gap:             0;
      padding-top:     0;
      padding-right:   var(--spacing-space-m);
      padding-left:    var(--spacing-space-m);
      box-sizing:      border-box;
      max-height:      0;
      overflow:        hidden;
      /* Flat layout: negative margin cancels the flex column's phantom 8px gap when height is 0. */
      margin-top:      calc(-1 * var(--spacing-space-xs));
      transition:      max-height 0.2s ease, margin-top 0.2s ease;
    }
    /* Both tablet and mobile: restore margin-top to 0 when open so the 8px column gap
       reappears between the trigger and the first sub-item. */
    .nav-menu-submenu.is-open { max-height: 500px; margin-top: 0; }
    /* Use margin instead of gap — flex gap can be unreliable inside overflow:hidden max-height containers. */
    .nav-menu-submenu .nav-menu-item + .nav-menu-item {
      margin-top: var(--spacing-space-xs);
    }
    /* Mobile: DS node 5283:122098 — pt:0, pb:16, pl:16, pr:16, border-radius:24px. */
    #NavMenu-Mobile .nav-menu-submenu {
      border-radius: 24px;
      margin-top:    calc(-1 * var(--spacing-space-xs));
      transition:    max-height 0.2s ease, margin-top 0.2s ease;
    }
    #NavMenu-Mobile .nav-menu-submenu.is-open { max-height: 800px; margin-top: 0; padding-bottom: var(--spacing-space-m); }

    /* CTA row: Notification + Download App button */
    .nav-menu-tablet__footer { padding: 0; display: flex; flex-direction: column; }
    .nav-menu-cta {
      display:       flex;
      gap:           var(--spacing-space-xs);
      align-items:   center;
      padding:       var(--spacing-space-xs);
      background:    var(--surface-secondary-default-subtle);
      box-shadow:    inset 0 0 0 1px #d1f7d1;
      border-radius: 28px;
    }
    .nav-menu-cta__notif {
      display:     flex;
      flex:        1 0 0;
      align-items: center;
      gap:         10px;
      padding:     var(--spacing-space-xs) var(--spacing-space-m);
      cursor:      pointer;
      color:       var(--icon-primary-default);
    }
    .nav-menu-cta__notif svg  { width: 24px; height: 24px; display: block; flex-shrink: 0; }
    .nav-menu-cta__notif-label {
      font-family: var(--font-family);
      font-size:   14px;
      font-weight: 600;
      color:       var(--text-default-body);
    }
    .nav-menu-cta__btn {
      /* DS node 3427:2586 — Button - 1.5 Primary/L(ish): 40px h, pad t:8 r:12 b:8 l:12
         primaryAxisAlignItems:CENTER → icon+label+arrow grouped and centred inside the pill */
      display:        flex;
      align-items:    center;
      justify-content: center;
      flex:           1 0 0;
      min-width:      0;
      height:         40px;
      padding:        var(--spacing-space-xs) var(--spacing-space-s);
      background:     var(--surface-primary-default);
      border:         none;
      box-shadow:     inset 0 0 0 1px var(--border-primary-focus);
      border-radius:  var(--corner-radius-corner-rounded);
      cursor:         pointer;
      color:          var(--icon-primary-on-color);  /* #e1f9ea — DS text+icon fill */
      font-family:    var(--font-family);
      font-size:      14px;
      font-weight:    600;
      gap:            0;
    }
    .nav-menu-cta__btn:hover  { background: var(--surface-secondary-default); box-shadow: inset 0 0 0 1px var(--border-secondary-focus); color: var(--text-secondary-focus); }
    .nav-menu-cta__btn:active { background: var(--surface-primary-focus);     box-shadow: inset 0 0 0 1px var(--border-primary-default); color: var(--text-primary-default); }
    /* Icon frame: 24×24, smartphone at 20×20 (2px inset each side — DS Icon frame) */
    .nav-menu-cta__btn-icon     { display: flex; flex-shrink: 0; width: 24px; height: 24px; align-items: center; justify-content: center; }
    .nav-menu-cta__btn-icon svg { width: 20px; height: 20px; display: block; }
    /* Label: DS pad l:8 r:8 — no flex:1, no growing */
    .nav-menu-cta__btn-text     { padding: 0 var(--spacing-space-xs); white-space: nowrap; }
    /* R Arrow: 24×24 pill, #99ebce bg, 4px pad → 16px clip, chevron #00a36a */
    .nav-menu-cta__btn-arrow    {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      background:    #99ebce;
      border-radius: var(--corner-radius-corner-rounded);
      flex-shrink:   0;
      padding:       var(--spacing-space-xxs);
      color:         var(--border-primary-focus);  /* chevron stroke #00a36a */
    }
    .nav-menu-cta__btn:hover  .nav-menu-cta__btn-arrow { background: var(--surface-secondary-default-subtle); }
    .nav-menu-cta__btn:active .nav-menu-cta__btn-arrow { background: var(--surface-primary-default); }
    .nav-menu-cta__btn-arrow svg { width: 16px; height: 16px; display: block; }

    /* Language switcher row */
    .nav-menu-locale {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      gap:             var(--spacing-space-xs);
      padding:         var(--spacing-space-m) var(--page-padding-x) 0;
    }
    .nav-menu-locale__btn {
      display: flex; align-items: center;
      cursor: pointer;
      color:      var(--text-primary-default);  /* #00cc85 — BM and Mandarin */
      background: none; border: none; padding: var(--spacing-space-xxs);
    }
    /* EN is the active locale — DS uses #00564C (Surface/tertiary/default) for selected locale stroke */
    .nav-menu-locale__btn:first-child { color: var(--surface-tertiary-default, #00564c); }
    .nav-menu-locale__btn:hover { opacity: 0.7; }
    .nav-menu-locale__btn svg { width: 24px; height: 24px; display: block; }

    /* ─────────────────────────────────────────────────────
       NAV MENU MOBILE — Nav Menu Mobile - 1.5 (DS node 3427:2442, Type=Mobile)
       Left panel · spans content width · full viewport height · snappy opacity+translateX
       Border R/B/L #00cc85 · no top border · rounded bottom corners 24px
       Triggered by Account btn in bottom navbar · z-index 500
       Stacking: content(0) → mobile-overlay(350) → navbar-bottom(400) → mobile-menu(500)
       Both navbar-bottom and mobile-menu are "at the front" above the overlay.
    ───────────────────────────────────────────────────── */
    .nav-menu-mobile {
      position:       fixed;
      bottom:         72px;  /* 56px navbar + 16px gap — anchored above bottom navbar */
      left:           0;
      width:          300px;
      max-height:     calc(100dvh - 72px);
      z-index:        500;
      background:     var(--surface-general-default);
      /* DS strokeWeights: top:1 right:1 bottom:1 left:0 — left edge is flat against page */
      border-top:     1px solid var(--border-primary-default);
      border-right:   1px solid var(--border-primary-default);
      border-bottom:  1px solid var(--border-primary-default);
      /* NO border-left — DS leftWeight:0 */
      border-radius:  0 24px 24px 0;  /* DS: tl:0 tr:24 br:24 bl:0 */
      box-sizing:     border-box;
      overflow-y:     auto;
      display:        flex;
      flex-direction: column;
      opacity:        0;
      transform:      translateX(-8px);
      pointer-events: none;
      visibility:     hidden;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }
    .nav-menu-mobile.is-open {
      opacity:        1;
      transform:      translateX(0);
      pointer-events: auto;
      visibility:     visible;
      transition:     opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
    }
    /* Overlay — DS Overlay/Overlay-Dark rgba(26,26,26,0.5) · snap on/off, no transition
       z-index 350 = above content, below navbar-bottom(400) so bottom nav stays visible */
    .mobile-overlay {
      position:       fixed;
      inset:          0;
      z-index:        350;
      background:     var(--overlay-dark);
      opacity:        0;
      pointer-events: none;
      visibility:     hidden;
    }
    .mobile-overlay.is-open {
      opacity:        1;
      pointer-events: auto;
      visibility:     visible;
    }

    /* Header — DS 3427:2443: h:60, pad t:16 r:16 b:16 l:16, gap:10 */
    .nav-menu-mobile__header {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      gap:             10px;
      padding:         var(--spacing-space-m);
      flex-shrink:     0;
      background:      var(--surface-general-default);
    }
    .nav-menu-mobile__logo { display: flex; align-items: center; flex-shrink: 0; }
    .nav-menu-mobile__close {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      color: var(--icon-default-default);
      background: none; border: none; padding: 0; cursor: pointer; flex-shrink: 0;
    }
    .nav-menu-mobile__close:hover { color: var(--icon-primary-default); }

    /* Menu — DS 3427:2461: pad t:0 r:16 b:16 l:16, gap:8 */
    .nav-menu-mobile__content {
      display:     flex;
      flex-direction: column;
      gap:         var(--spacing-space-xs);
      padding:     0 var(--spacing-space-m) var(--spacing-space-m);
      flex-shrink: 0;
    }

    /* CTA — DS 3427:2477: VERTICAL, pad:8, gap:8, radius:20 (differs from tablet radius:28) */
    .nav-menu-mobile .nav-menu-cta { flex-direction: column; border-radius: 20px; }
    .nav-menu-mobile .nav-menu-cta__notif { width: 100%; }
    .nav-menu-mobile .nav-menu-cta__btn   { width: 100%; }

    /* Locale — DS 3427:2479: pad t:0 r:60 b:0 l:60, gap:8, space-between
       Direct child of Menu frame — no top padding (gap from content provides 8px) */
    .nav-menu-mobile__locale {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      gap:             var(--spacing-space-xs);
      padding:         0 var(--page-padding-x);
      flex-shrink:     0;
    }

    /* ─────────────────────────────────────────────────────
       NAVBAR MOBILE BOTTOM — Navbar Mobile - 1.5 (DS node 3406:735)
       Fixed bottom · height 56px · top border #00cc85
       4 buttons: Quiz / Practice / Score / Account
       Shown only at mobile (≤767px)
    ───────────────────────────────────────────────────── */
    .navbar-bottom {
      position:        fixed;
      bottom:          0;
      left:            0;
      right:           0;
      z-index:         400;
      height:          56px;
      background:      var(--surface-general-default);
      border-top:      1px solid var(--border-primary-default);
      display:         none;
      align-items:     center;
      justify-content: center;
      gap:             var(--spacing-space-xxs);
      padding:         var(--spacing-space-m);
    }
    /* Button - 1.5 Tertiary/S/Student — all states confirmed from DS nodes
       1452:8381 Default · 1452:8373 Hover · 3029:20042 Pressed · 1452:8365 Active · 1452:8357 Disabled
       strokeAlign: INSIDE → box-shadow:inset, never border (Rule 60)
       Dimensions: h:24px, padding:2px 4px, border-radius:60px (pill) */
    .navbar-bottom__btn {
      display:       flex;
      align-items:   center;
      height:        24px;
      max-height:    24px;
      padding:       2px 4px;             /* DS: paddingTop:2 paddingRight:4 paddingBottom:2 paddingLeft:4 */
      background:    var(--surface-general-default);   /* Default: Surface/general/default #ffffff */
      border-radius: var(--corner-radius-corner-rounded);   /* 60px pill */
      box-shadow:    none;                /* Default: no stroke */
      border:        none;
      cursor:        pointer;
