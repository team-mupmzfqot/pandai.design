    .recent-carousel__track .quiz-card {
      flex-shrink: 0;
      min-width:   300px;
      max-width:   370px;
    }

    /* Tablet */
    @media (max-width: 1279px) {
      :root {
        --page-padding-x:          32px;
        --check-in-card-max-width: none;
      }
      .primary-card__content {
        grid-template-columns: repeat(2, 1fr);
      }
      /* DS Responsives: H1 28px → 24px at tablet */
      .welcome-text__name { font-size: 24px; line-height: 36px; }


      /* Avatar - 1.5 Size=XL on tablet (64×64, node 684:627) */
      .welcome-avatar { width: 64px; height: 64px; min-width: 64px; min-height: 64px; }
      .welcome-avatar-group { width: 64px; height: 64px; min-width: 64px; min-height: 64px; }
      .welcome-avatar-group .navbar-badge { width: 20px; height: 20px; }

      /* Welcome section — Tablet + Mobile: welcome-row flex-wrap layout
         Row 1: welcome-text (flex:1) + Avatar-Mobile
         Row 2: status-badges (full-width)
         Row 3: check-in-card (full-width)
         #Welcome-Desktop → display:contents so its children join .welcome-row directly */
      .welcome-row     { display: flex; flex-wrap: wrap; gap: var(--spacing-space-m); }
      #Welcome-Desktop { display: contents; }
      .welcome-text    { order: 1; flex: 1; min-width: 0; text-align: left; }
      #Avatar-Mobile   { display: flex; flex-shrink: 0; order: 2; }
      .status-badges   { order: 3; flex-basis: 100%; }
      .check-in-card   { order: 4; flex-basis: 100%; width: 100%; }

      /* Status badges — each pill fills equal share of the full-width row */
      .status-pill             { flex: 1; min-width: 0; }
      .status-pill-flipper     { flex: 1; min-width: 0; }
      .status-pill-flipper__inner { width: 100%; }
      .status-pill-face--front { width: 100%; }
    }

    /* Mobile */
    @media (max-width: 767px) {
      :root {
        --page-padding-x: var(--spacing-space-m);   /* 16px */
      }
      /* DS Responsives: H1→20px, T1/T2→16px, T3/T4/T5→14px at mobile */
      .welcome-text__name    { font-size: 20px; line-height: 32px; }
      .static-card__title    { font-size: 16px; line-height: 24px; }
      .section-header__title { font-size: 16px; line-height: 24px; }
      /* Status Badge Size=M mobile — each pill fills equal share of the full-width .status-badges row.
         Icon ellipse, corners, padding, gap all untouched — only text frame fills the pill width. */
      .status-pill              { height: 32px; max-height: 32px; min-height: unset; min-width: 0; padding: 4px 2px 4px 4px; flex: 1; }
      .status-pill-flipper      { flex: 1; min-width: 0; }
      .status-pill-flipper__inner { width: 100%; }
      .status-pill-face--front  { width: 100%; }
      .status-pill__label       { display: none; }
      .status-pill__value       { font-size: 14px; font-weight: 600; line-height: 20px; }
      .status-pill__icon        { width: 24px; height: 24px; padding: 4px 2px; flex-shrink: 0; }
      .status-pill__icon svg    { height: 16px; }

      /* Single-column quiz grid */
      .primary-card__content {
        grid-template-columns: 1fr;
      }

      /* Wrap static cards downward — each card full width, wraps to next row, height hugs content */
      .static-cards-row { flex-wrap: wrap; }
      .static-cards-row .static-card { flex-basis: 100%; height: auto; }
      .static-cards-row .static-card .static-card__content { height: auto; }

      /* Carousel — Mobile variant (DS Type=Mobile, node 3060:869)
         Full-width bleed (no page padding), no nav buttons, no rounded frame, 152px height */
      #Carousel-Desktop {
        width:       100vw;
        min-width:   390px;
        margin-left: calc(-1 * var(--page-padding-x));
      }
      .carousel__content {
        border-radius: 0;
      }
      .carousel__btn-wrap {
        display: none;
      }
      .carousel__card {
        height:        152px;
        width:         auto;
        aspect-ratio:  428 / 186;
        max-width:     calc(100vw - 32px);
      }
      .carousel__track {
        gap: var(--spacing-space-xs);   /* 8px — DS mobile gap */
      }
      /* Indicator — Mobile variant (DS node 3060:881): 88×12px, 8×8px dots, gap 10px, h-padding 4px */
      .carousel__indicator {
        padding:     0 4px;   /* horizontal only — dots at y:0 in 12px frame */
        gap:         10px;
        height:      12px;
        align-items: center;
      }
      .carousel__dot {
        width:  8px;
        height: 8px;
      }

      /* Quiz card: floor at 300px on mobile */
      .quiz-card {
        min-width: 300px;
      }


      /* Subject Badge M variant at mobile — switch Section 4 back to M (16px icon, 24px badge).
         M badge = 24px tall: 4px top + 16px icon + 4px bottom = 24px. */
      #YourSelectedSubjects-Desktop .quiz-card__header .subject-badge      { height: 24px; max-height: 24px; }
      #YourSelectedSubjects-Desktop .quiz-card__header .subject-badge__text { font-size: 12px; line-height: 12px; }
      #YourSelectedSubjects-Desktop .quiz-card__header .subject-badge__icon svg,
      #YourSelectedSubjects-Desktop .quiz-card__header .subject-badge__icon img { height: 16px; width: auto; }

      /* Status badges: allow wrapping when pills don't fit in a single row */
      .status-badges { flex-wrap: wrap; }

      /* Avatar - 1.5 Size=L on mobile (48×48) — tablet uses XXL (100×100) */
      /* Avatar - 1.5 Size=L on mobile (56×56 Type=Image, node 684:621) */
      .welcome-avatar { width: 56px; height: 56px; min-width: 56px; min-height: 56px; }
      .welcome-avatar-group { width: 56px; height: 56px; min-width: 56px; min-height: 56px; }
      .welcome-avatar-group .navbar-badge { width: 16px; height: 16px; }

      /* Mobile: hide top hamburger navbar → replaced by bottom Navbar Mobile - 1.5 */
      #NavBar-Mobile { display: none; }
      body { padding-top: var(--spacing-space-m); }

      /* Mobile bottom navbar visible; desktop footer hidden */
      .navbar-bottom { display: flex; }
      .footer        { display: none; }
      body           { padding-bottom: 56px; }   /* bottom navbar height */
    }

    /* ═══════════════════════════════════════════════════════════════
       PAGE VIEWPORT — placeholder zone for DS component instances
       Drop Figma DS components here to build page content.
    ═══════════════════════════════════════════════════════════════ */

    .page-viewport {
      display:         flex;
      flex-direction:  column;
      align-items:     center;
      justify-content: center;
      flex:            1;
      min-height:      0;
      background:      var(--surface-general-default);
      box-shadow:      inset 0 0 0 1px var(--border-general-default);
      border-radius:   var(--corner-radius-corner-4xl);
    }

    .page-viewport__placeholder {
      display:         flex;
      flex-direction:  column;
      align-items:     center;
      justify-content: center;
      gap:             var(--spacing-space-xs);
      padding:         var(--spacing-space-xl);
      color:           var(--text-disabled-default);
      font-size:       14px;
      font-weight:     500;
      text-align:      center;
      pointer-events:  none;
      user-select:     none;
    }

    .page-viewport__placeholder svg {
      width:  24px;
      height: 24px;
      color:  var(--text-disabled-default);
    }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       PAGE SHELL
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .pd-page { flex: 1; padding: var(--space-m) var(--page-padding-x) var(--space-m); }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       BREADCRUMBS 1.5  DS 837:1033
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .pd-breadcrumbs15 { display: flex; align-items: center; gap: var(--space-m); min-height: 36px; margin-bottom: var(--space-m); }
    .pd-breadcrumbs__title { font-size: 24px; font-weight: 500; line-height: 36px; color: var(--text-tertiary-default); white-space: nowrap; }
    .pd-breadcrumbs__sep   { width: 1px; align-self: stretch; background: var(--border-general-default); flex-shrink: 0; }
    .pd-breadcrumbs__links { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
    .pd-link15 {
      display: flex; align-items: center; gap: var(--space-xs);
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--text-default-body);
    }
    .pd-link15__icon-home { display: block; width: 20px; height: 20px; flex-shrink: 0; color: var(--text-primary-default); }
    .pd-link15__text         { font-size: 14px; font-weight: 400; line-height: 20px; color: var(--text-default-body); white-space: nowrap; }
    .pd-link15__text--parent { color: var(--text-primary-default); }
    .pd-breadcrumbs__chevron { width: 16px; height: 16px; color: var(--text-primary-default); flex-shrink: 0; }

    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       FILTER CARD  DS 5376:250770
       Primary Card: green border, #e8fbe8 bg, vertical layout
       Row 1: filter header (left) + dropdown button (right)
       Row 2: subjects chips â€” hidden until button clicked
    â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .sc-filter-card {
      display: flex; flex-direction: column;
      padding: var(--space-m);
      background: var(--surface-secondary-default-subtle);
      box-shadow: inset 0 0 0 1px var(--border-primary-default);
      border-radius: var(--corner-4xl);
      margin-bottom: var(--space-m);
      gap: 0;
    }
    /* Top row: header label left, dropdown button right */
    .sc-filter-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: var(--space-m);
    }
    .sc-filter-header {
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .sc-filter-icon-wrap {
      width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--icon-tertiary-default);
    }
    .sc-filter-icon-wrap svg { display: block; width: 24px; height: 24px; }
    .sc-filter-title {
      font-size: 18px; font-weight: 600; line-height: 28px;
      color: var(--text-tertiary-default);
      white-space: nowrap;
    }

    /* Button-Dropdown-1.5 â€” DS confirmed: 40px h, 60px radius, white bg, #d9d9d9 border */
    .sc-filter-dropdown {
      display: flex; align-items: center; gap: var(--space-xs);
      height: 40px; padding: 8px 8px 8px 12px;
      background: var(--surface-general-default);
      border: none; box-shadow: inset 0 0 0 1px #d9d9d9;
      border-radius: var(--corner-rounded);
      cursor: pointer; font-family: var(--font);
      flex-shrink: 0; width: 313px; max-width: 100%;
      user-select: none;
    }
    .sc-filter-dropdown.is-open { box-shadow: inset 0 0 0 1px var(--border-primary-default); }
    .sc-filter-dropdown:hover   { box-shadow: inset 0 0 0 1px var(--border-primary-default); }

    .sc-filter-dropdown__label {
      flex: 1; min-width: 0;
      font-size: 14px; font-weight: 600; line-height: 20px;
      color: #666666; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Green circle arrow */
    .sc-filter-dropdown__arrow {
      width: 24px; height: 24px; flex-shrink: 0;
      background: var(--surface-primary-default);
      border-radius: 60px; padding: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s ease;
    }
    .sc-filter-dropdown.is-open .sc-filter-dropdown__arrow { transform: rotate(180deg); }
    .sc-filter-dropdown__arrow svg { display: block; width: 16px; height: 16px; color: var(--surface-general-default); }

    /* Subjects chip row â€” hidden by default, expands on open */
    .sc-subjects-row {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 12px;
      max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease, padding-top 0.25s ease;
    }
    .sc-subjects-row.is-open {
      max-height: 500px; opacity: 1;
      padding-top: var(--space-m);
    }

    /* Subject pill buttons â€” DS Button-1.5 Secondary/M */
    .sc-subject-chip {
      display: inline-flex; align-items: center; justify-content: center;
      height: 32px; min-height: 32px; max-height: 32px;
      padding: 2px 8px;
      border-radius: 60px;
      background: var(--surface-general-default);
      border: none; box-shadow: inset 0 0 0 1px var(--border-primary-default);
