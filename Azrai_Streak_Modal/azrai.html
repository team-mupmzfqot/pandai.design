<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandai — Student Streak Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Pandai DS 1.5 — Exact token values from Figma component output
       Node: 2276:42117  |  Reward Card 1.5
       Product mode: Student (Primary = OG Green)
    ═══════════════════════════════════════════════════════════════ */
    :root {
      /* ── Surface ────────────────────────────────────────────────── */
      --surface-default:              #FFFFFF;
      --surface-subtle:               #F9FAFB;
      --surface-sunken:               #F3F4F6;
      --surface-primary:              #00CC85;   /* surface/primary/default */
      --surface-primary-subtle:       #CCF5E7;   /* surface/primary/default-subtle */
      --surface-primary-subtle-hover: #99EBCE;   /* surface/primary/default-subtle-hover */

      /* ── Purple — Streak pill (Status Pill 1.5 / Straek type) ───── */
      --purple-500: #7367F0;   /* purple/500-(base) */
      --purple-600: #5C52C0;   /* purple/600 */

      /* ── Border ─────────────────────────────────────────────────── */
      --border-default:               #D9D9D9;   /* border/general/default */
      --border-subtle:                #F0F0F0;
      --border-primary:               #00CC85;   /* border/primary/default */
      --border-primary-focus:         #00A36A;   /* border/primary/focus */

      /* ── Text ───────────────────────────────────────────────────── */
      --text-heading:                 #404040;   /* text/default/heading */
      --text-body:                    #666666;   /* text/default/body */
      --text-caption:                 #BFBFBF;   /* text/default/caption */
      --text-secondary:               #999999;
      --text-disabled:                #CCCCCC;
      --text-primary:                 #00CC85;   /* text/primary/default */
      --text-on-color:                #E9FBF5;   /* text/primary/on-color */

      /* ── Corner Radius ──────────────────────────────────────────── */
      --radius-xs:      4px;
      --radius-sm:      6px;
      --radius-md:      8px;
      --radius-lg:      12px;
      --radius-xl:      16px;
      --radius-4xl:     24px;   /* corner-radius/corner-4xl */
      --radius-rounded: 60px;   /* corner-radius/corner-rounded (pill) */
      --radius-circle:  50%;

      /* ── Spacing ─────────────────────────────────────────────────── */
      --space-xxxs: 2px;    /* space-xxxs */
      --space-xxs:  4px;    /* space-xxs */
      --space-xs:   8px;    /* space-xs */
      --space-s:    12px;   /* space-s */
      --space-m:    16px;   /* space-m */
      --space-l:    20px;   /* space-l */
      --space-xl:   24px;   /* space-xl */
      --space-xxl:  28px;   /* space-xxl */

      /* ── Elevation ───────────────────────────────────────────────── */
      --elevation-xs:      0 1px 3px  rgba(0,0,0,0.06);
      --elevation-sm:      0 2px 8px  rgba(0,0,0,0.08);
      --elevation-md:      0 4px 16px rgba(0,0,0,0.10);
      --elevation-overlay: 0 20px 60px rgba(0,0,0,0.20);

      /* ── Typography — Poppins ────────────────────────────────────── */
      --font: 'Poppins', sans-serif;

      /* Text style tokens (Body/B*) */
      /* B1  = SemiBold 14px / lh 20px */
      /* B3  = Regular  14px / lh 20px */
      /* B5  = SemiBold 12px / lh 18px */
      /* B8  = Medium   10px / lh 12px */
    }

    /* ═══════════════════════════════════════════════════════════════
       Reset
    ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: #F0F2F5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: var(--space-m);
    }

    /* ═══════════════════════════════════════════════════════════════
       Trigger Button
       DS: Button 1.5 / Primary / Solid / Pill
    ═══════════════════════════════════════════════════════════════ */
    .btn-trigger {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xxs);
      background: var(--surface-primary);
      color: var(--text-on-color);
      border: 1px solid var(--border-primary-focus);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      padding: 10px var(--space-l);
      border-radius: var(--radius-rounded);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      user-select: none;
    }
    .btn-trigger:hover  { background: #00B876; }
    .btn-trigger:active { background: var(--border-primary-focus); transform: scale(0.98); }

    .hint {
      font-size: 11px;
      color: #999;
      font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════════
       Modal Overlay
    ═══════════════════════════════════════════════════════════════ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.48);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .overlay.open {
      opacity: 1;
      visibility: visible;
    }
    @media (min-width: 520px) {
      .overlay { align-items: center; padding: var(--space-m); }
    }

    /* ═══════════════════════════════════════════════════════════════
       Modal Card
       DS: corner-radius/corner-4xl = 24px | border/general/default = #D9D9D9
    ═══════════════════════════════════════════════════════════════ */
    .modal {
      background: var(--surface-default);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-4xl) var(--radius-4xl) 0 0;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--elevation-overlay);
      overflow: hidden;
      transform: translateY(32px);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.34, 1.20, 0.64, 1),
                  opacity  0.28s ease;
    }
    .overlay.open .modal {
      transform: translateY(0);
      opacity: 1;
    }
    @media (min-width: 520px) {
      .modal {
        border-radius: var(--radius-4xl);
        transform: scale(0.92) translateY(8px);
      }
      .overlay.open .modal {
        transform: scale(1) translateY(0);
      }
    }

    /* ──────────────────────────────────────────────────────────────
       Modal Header
       DS: surface/primary/default = #00CC85 — FLAT, no gradient
    ────────────────────────────────────────────────────────────── */
    .modal-header {
      background: var(--surface-primary);
      padding: var(--space-xl) var(--space-m) var(--space-l);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xxs);
    }

    .btn-close {
      position: absolute;
      top: var(--space-m);
      right: var(--space-m);
      width: 30px;
      height: 30px;
      border-radius: var(--radius-circle);
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.32);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-close:hover  { background: rgba(255,255,255,0.30); }
    .btn-close:active { background: rgba(255,255,255,0.12); }

    .header-flame {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-xxs);
      animation: flamePulse 2.4s ease-in-out infinite;
    }

    .header-flame img {
      display: block;
      /* scale up from 17×24 native — 2× for header prominence */
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.24));
    }

    /* DS: Title/T1 = 18px Bold */
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-on-color);
      letter-spacing: -0.2px;
      text-align: center;
    }

    /* DS: Body/B3 = 14px Regular */
    .modal-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: rgba(233, 251, 245, 0.80);  /* text-on-color @ 80% */
      text-align: center;
    }

    /* ──────────────────────────────────────────────────────────────
       Modal Body
    ────────────────────────────────────────────────────────────── */
    .modal-body {
      padding: var(--space-m);
      display: flex;
      flex-direction: column;
      gap: var(--space-l);
    }

    /* ──────────────────────────────────────────────────────────────
       User Row
       DS: Avatar 1.5 (node 843:822) + Label Badge Solid
    ────────────────────────────────────────────────────────────── */
    .user-row {
      display: flex;
      align-items: center;
      gap: var(--space-m);
      padding: var(--space-s) var(--space-m);
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    /* Wrapper holds avatar + overlaid badge */
    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 64px;
      height: 64px;
    }

    /* DS: Avatar 1.5 — 64×64 | white bg | 1px solid #00CC85 | corner-rounded 60px */
    .avatar-1-5 {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-rounded);   /* corner-rounded = 60px */
      background: var(--surface-default);     /* surface/general/default = white */
      border: 1px solid var(--border-primary); /* border/default = #00CC85 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* DS: Avatar 1.5 / Initials — Poppins Medium 24px | text/primary/default #00CC85 */
    .avatar-initials {
      font-family: var(--font);
      font-size: 24px;        /* Header/H3 */
      font-weight: 500;       /* Medium */
      line-height: 36px;
      color: var(--text-primary);   /* #00CC85 — NOT on-color */
    }

    /* DS: Badges - Number - 1.5
       20×20px | bg #00CC85 flat | radius corner-rounded 60px
       Position: left 44px, top 0 (per Figma node 689:749) */
    .avatar-badge {
      position: absolute;
      top: 0;
      left: 44px;
      width: 20px;
      height: 20px;
      min-width: 20px;
      background: var(--surface-primary);     /* flat #00CC85 */
      border-radius: var(--radius-rounded);   /* 60px */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* DS: Body/B7 = SemiBold 10px / lh 12px */
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      line-height: 12px;
      color: var(--text-on-color);            /* #E9FBF5 */
    }

    .user-info { flex: 1; min-width: 0; }

    /* DS: Title/T1 = Bold 18px / lh 28px | text/default/caption = #BFBFBF */
    .user-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      color: var(--text-caption);             /* #BFBFBF */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* DS: Body/B8 = Medium 10px / lh 12px */
    .user-meta {
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
      color: var(--text-secondary);
    }

    /* ──────────────────────────────────────────────────────────────
       Status Pill 1.5 — Streak type  (node 2312:10662)
       DS: bg #7367F0 | border #5C52C0 | radius 40.5px | w 122px
       Left: text col (label 10px SemiBold + value 16px Bold, white)
       Right: white pill icon wrapper (39px wide, radius corner-pill 999px)
    ────────────────────────────────────────────────────────────── */
    .status-pill {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
      background: var(--purple-500);
      border: 1px solid var(--purple-600);
      border-radius: 40.5px;
      padding: var(--space-xs);
      min-width: 122px;
      width: 122px;
      overflow: hidden;
    }

    .status-pill-inner {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding-left: var(--space-xs);
      width: 100%;
    }

    .status-pill-texts {
      flex: 1 0 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-bottom: 4px;
      color: white;
    }

    /* DS: Body/B7 = Poppins SemiBold 10px / lh 12px */
    .status-pill-label {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      line-height: 12px;
      color: white;
      white-space: nowrap;
      margin-bottom: -4px;
    }

    /* DS: Title/T3 = Poppins Bold 16px / lh 24px */
    .status-pill-value {
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
      color: white;
      white-space: nowrap;
      margin-bottom: -4px;
    }

    /* Right icon container — white pill, 39px wide, full height */
    .status-pill-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 39px;
      align-self: stretch;
      background: var(--surface-default);   /* white */
      border-radius: var(--radius-pill);    /* corner-pill = 999px */
      overflow: hidden;
    }

    .status-pill-icon img {
      width: 17px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    /* ──────────────────────────────────────────────────────────────
       Streak Section
    ────────────────────────────────────────────────────────────── */
    .streak-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-m);
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* DS: Body/B8 = 10px Medium, uppercase tracking */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      color: var(--text-body);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ──────────────────────────────────────────────────────────────
       Week Timeline
    ────────────────────────────────────────────────────────────── */
    .timeline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      padding-top: 4px;
    }

    /* Base connector — grey */
    .timeline::before {
      content: '';
      position: absolute;
      top: calc(4px + 18px);   /* padding-top + half of 36px dot */
      left: 18px;
      right: 18px;
      height: 2px;
      background: var(--border-default);
      z-index: 0;
    }

    /* Progress connector — primary green, width set via JS */
    .timeline-line {
      position: absolute;
      top: calc(4px + 18px);
      left: 18px;
      height: 2px;
      background: var(--surface-primary);    /* flat #00CC85, no gradient */
      z-index: 1;
      width: 0%;
      transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      border-radius: 2px;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xxs);
      flex: 1;
      position: relative;
      z-index: 2;
    }

    /* DS: Progress node circles — 36px */
    .day-dot {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-circle);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-dot.future {
      background: var(--surface-sunken);
      border: 2px solid var(--border-default);
      color: var(--text-disabled);
    }

    .day-dot.done {
      background: var(--surface-primary);    /* flat #00CC85 */
      border: 2px solid var(--border-primary);
      color: var(--text-on-color);
      transform: scale(0);
      opacity: 0;
    }
    .day-dot.done.pop {
      transform: scale(1);
      opacity: 1;
      transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity  0.22s ease;
    }

    .day-dot.today {
      background: var(--surface-primary);    /* flat #00CC85 */
      border: 2px solid var(--border-primary);
      color: var(--text-on-color);
      position: relative;
    }
    .day-dot.today::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid var(--border-primary);
      animation: pulseRing 2s ease-out infinite;
    }

    /* DS: Body/B8 = 10px Medium */
    .day-label {
      font-size: 10px;
      font-weight: 500;
      line-height: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .day-label.active {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* checkmark svg */
    .check-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ──────────────────────────────────────────────────────────────
       Streak meta row
    ────────────────────────────────────────────────────────────── */
    .streak-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* DS: Body/B3 = 14px Regular */
    .meta-text {
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
      color: var(--text-body);
    }

    /* ──────────────────────────────────────────────────────────────
       Progress Bar 1.5
       DS: height 8px | radius-rounded (pill) | flat fill #00CC85
    ────────────────────────────────────────────────────────────── */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* DS: Body/B5 = 12px SemiBold / lh 18px */
    .progress-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      color: var(--text-heading);
    }

    .progress-pct {
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      color: var(--text-primary);
      min-width: 32px;
      text-align: right;
    }

    /* DS: Progress Bar 1.5 track */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-sunken);
      border-radius: var(--radius-rounded);
      overflow: hidden;
    }

    /* DS: Progress Bar 1.5 fill — flat #00CC85, no gradient */
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-rounded);
      background: var(--surface-primary);    /* flat, no gradient */
      transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ──────────────────────────────────────────────────────────────
       Divider
       DS: Divider / Var 5 (1px #D9D9D9)
    ────────────────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border-default);
      margin: 0 var(--space-m);
    }

    /* ──────────────────────────────────────────────────────────────
       Modal Footer — CTA Button
       DS: Button 1.5 / Primary / Solid / Pill (corner-rounded 60px)
    ────────────────────────────────────────────────────────────── */
    .modal-footer {
      padding: var(--space-m);
      padding-top: var(--space-s);
    }

    .btn-cta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xxs);
      background: var(--surface-primary);    /* flat #00CC85 */
      color: var(--text-on-color);           /* #E9FBF5 */
      border: 1px solid var(--border-primary-focus);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      padding: 12px var(--space-m);
      border-radius: var(--radius-rounded);  /* 60px pill */
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-cta:hover  { background: #00B876; }
    .btn-cta:active { background: var(--border-primary-focus); transform: scale(0.99); }

    /* ═══════════════════════════════════════════════════════════════
       Keyframes
    ═══════════════════════════════════════════════════════════════ */
    @keyframes flamePulse {
      0%,100% { transform: scale(1.00) rotate(-4deg); }
      50%      { transform: scale(1.12) rotate( 4deg); }
    }

    @keyframes pulseRing {
      0%   { transform: scale(0.80); opacity: 0.80; }
      70%  { transform: scale(1.44); opacity: 0; }
      100% { transform: scale(1.44); opacity: 0; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ── Trigger Button ── -->
  <button class="btn-trigger" id="btnOpen">
    🔥 View My Streak
  </button>
  <span class="hint">Click to open modal</span>

  <!-- ═══════════════════════════════════════════════════════════════
       Modal
  ═══════════════════════════════════════════════════════════════ -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modal">

      <!-- Header — flat #00CC85, no gradient -->
      <div class="modal-header">
        <button class="btn-close" id="btnClose" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M11 1L1 11M1 1L11 11" stroke="#E9FBF5" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- DS: P.Streak icon (node 2308:11168) — 17×24px viewBox -->
        <div class="header-flame">
          <img src="assets/p-streak.svg" alt="Streak" width="34" height="48">
        </div>
        <h2 class="modal-title" id="modalTitle">Weekly Streak</h2>
        <p class="modal-subtitle">Stay consistent — learn something every day!</p>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- User Row: Avatar 1.5 (node 843:822) + Label Badge Solid -->
        <div class="user-row">

          <!-- DS: Avatar 1.5 / Initials type — 64×64, white+border, badge overlay -->
          <div class="avatar-wrapper">
            <div class="avatar-1-5">
              <!-- Initials variant: Poppins Medium 24px, color #00CC85 -->
              <span class="avatar-initials">AA</span>
            </div>
            <!-- DS: Badges - Number - 1.5 | position left:44px top:0 -->
            <div class="avatar-badge">15</div>
          </div>

          <div class="user-info">
            <!-- DS: Title/T1 Bold 18px | text/default/caption #BFBFBF -->
            <div class="user-name">Ahmad Azrai</div>
            <div class="user-meta">Student · Form 4</div>
          </div>

          <!-- DS: Status Pill 1.5 / Streak (node 2312:10662) -->
          <div class="status-pill">
            <div class="status-pill-inner">
              <div class="status-pill-texts">
                <span class="status-pill-label">Streak</span>
                <span class="status-pill-value">5 Days</span>
              </div>
              <div class="status-pill-icon">
                <img src="assets/p-streak.svg" alt="Streak icon">
              </div>
            </div>
          </div>
        </div>

        <!-- Streak + Timeline -->
        <div class="streak-section">

          <div class="section-row">
            <span class="section-label">This Week</span>
            <!-- DS: Status Pill 1.5 / Streak (node 2312:10662) — animated value -->
            <div class="status-pill">
              <div class="status-pill-inner">
                <div class="status-pill-texts">
                  <span class="status-pill-label">Streak</span>
                  <span class="status-pill-value" id="streakCount">0</span>
                </div>
                <div class="status-pill-icon">
                  <img src="assets/p-streak.svg" alt="Streak icon">
                </div>
              </div>
            </div>
          </div>

          <!-- Week Timeline -->
          <div class="timeline" id="timeline">
            <div class="timeline-line" id="timelineLine"></div>
            <!-- Day columns injected by JS -->
          </div>

          <!-- Meta row -->
          <div class="streak-meta">
            <span class="meta-text">
              <span id="daysNum">0</span> of 7 days completed
            </span>
          </div>

          <!-- Progress Bar 1.5 -->
          <div class="progress-section">
            <div class="progress-header">
              <span class="progress-label">Weekly Goal Progress</span>
              <span class="progress-pct" id="pctLabel">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

        </div>
      </div><!-- /modal-body -->

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Footer CTA: Button 1.5 / Primary / Solid / Pill -->
      <div class="modal-footer">
        <button class="btn-cta" id="btnCta">
          Awesome! Keep it up 🎉
        </button>
      </div>

    </div><!-- /modal -->
  </div><!-- /overlay -->

  <script>
    /* ── Streak Data ─────────────────────────────────────────── */
    const STREAK = {
      count: 5,
      goal: 7,
      days: [
        { label: 'MON', done: true,  today: false },
        { label: 'TUE', done: true,  today: false },
        { label: 'WED', done: true,  today: false },
        { label: 'THU', done: true,  today: false },
        { label: 'FRI', done: true,  today: true  },
        { label: 'SAT', done: false, today: false },
        { label: 'SUN', done: false, today: false },
      ]
    };

    const PCT = Math.round((STREAK.count / STREAK.goal) * 100);

    /* ── Build Timeline ──────────────────────────────────────── */
    const timeline = document.getElementById('timeline');

    STREAK.days.forEach(day => {
      const col = document.createElement('div');
      col.className = 'day-col';

      const dot = document.createElement('div');

      if (day.today) {
        dot.className = 'day-dot today';
        dot.innerHTML = `<svg class="check-icon" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 7L5.5 10L11.5 4" stroke="#E9FBF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      } else if (day.done) {
        dot.className = 'day-dot done';
        dot.innerHTML = `<svg class="check-icon" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 7L5.5 10L11.5 4" stroke="#E9FBF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      } else {
        dot.className = 'day-dot future';
      }

      const lbl = document.createElement('div');
      lbl.className = 'day-label' + ((day.done || day.today) ? ' active' : '');
      lbl.textContent = day.label;

      col.appendChild(dot);
      col.appendChild(lbl);
      timeline.appendChild(col);
    });

    /* ── Count-up helper ─────────────────────────────────────── */
    function countUp(el, to, ms, suffix = '') {
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min((now - t0) / ms, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(ease * to) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      })(performance.now());
    }

    /* ── Animate on open ─────────────────────────────────────── */
    function runAnimations() {
      /* 1. Staggered dot pop-in */
      document.querySelectorAll('.day-dot.done').forEach((d, i) => {
        setTimeout(() => d.classList.add('pop'), 280 + i * 90);
      });

      /* 2. Connector line fill — covers gaps between completed dots */
      const totalGaps   = STREAK.days.length - 1;           // 6
      const doneDots    = STREAK.days.filter(d => d.done || d.today).length;
      const filledGaps  = doneDots - 1;                     // 4
      const lineWidthPct = (filledGaps / totalGaps) * 100;  // ~66.67%
      setTimeout(() => {
        document.getElementById('timelineLine').style.width = lineWidthPct + '%';
      }, 260);

      /* 3. Progress bar */
      setTimeout(() => {
        document.getElementById('progressFill').style.width = PCT + '%';
        countUp(document.getElementById('pctLabel'), PCT, 1100, '%');
      }, 460);

      /* 4. Counter badges */
      setTimeout(() => {
        countUp(document.getElementById('streakCount'), STREAK.count, 860, ' Days');
        countUp(document.getElementById('daysNum'),     STREAK.count, 820);
      }, 300);
    }

    /* ── Reset ───────────────────────────────────────────────── */
    function resetAnimations() {
      document.querySelectorAll('.day-dot.done').forEach(d => d.classList.remove('pop'));
      document.getElementById('timelineLine').style.width   = '0%';
      document.getElementById('progressFill').style.width   = '0%';
      document.getElementById('pctLabel').textContent        = '0%';
      document.getElementById('streakCount').textContent     = '0 Days';
      document.getElementById('daysNum').textContent         = '0';
    }

    /* ── Open / Close ────────────────────────────────────────── */
    const overlay = document.getElementById('overlay');

    function openModal() {
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      runAnimations();
    }
    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(resetAnimations, 320);
    }

    document.getElementById('btnOpen').addEventListener('click', openModal);
    document.getElementById('btnClose').addEventListener('click', closeModal);
    document.getElementById('btnCta').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  </script>

</body>
</html>
